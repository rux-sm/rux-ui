<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#101112" />
		<title>Driver Schedule · Scarmilla Tour Buses</title>
		<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="./css/tokens.css?v=19" />
		<link rel="stylesheet" href="./css/colors_and_type.css" />
		<link rel="stylesheet" href="./css/components.css?v=54" />
		<link rel="stylesheet" href="./css/features/driver-share.css?v=11" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap"
		/>
	</head>
	<body class="driver-share-page">
		<header class="driver-share-header">
			<img class="driver-share-header__logo" src="./assets/logo.png" alt="Scarmilla Tour Buses" />
			<span class="driver-share-header__label">Driver Schedule</span>
		</header>

		<main class="driver-share" id="driver-share-root">
			<section class="driver-share-status" data-share-status>
				<span class="rux-spinner" aria-hidden="true"></span>
				<p>Loading assignments…</p>
			</section>
		</main>

		<dialog class="driver-share-envelope" id="driver-share-envelope">
			<div class="driver-share-envelope__toolbar">
				<button type="button" class="rux-button rux-button--default" data-envelope-dismiss>Close</button>
				<button type="button" class="rux-button rux-button--accent" data-envelope-print>
					<span class="rux-icon" aria-hidden="true">print</span> Print
				</button>
			</div>
			<div data-envelope-sheet></div>
		</dialog>

		<script type="module" src="./js/pages/driver-share.js?v=8"></script>
	</body>
</html>
