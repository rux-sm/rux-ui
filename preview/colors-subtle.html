<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/colors_and_type.css" />
    <style>
      body { padding: var(--rux-space-5); display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--rux-space-3); }
      .b { padding: var(--rux-space-3); border-radius: var(--rux-radius-sm); border: var(--rux-border-width) solid var(--rux-border); }
      .b.subtle-accent  { background: var(--rux-accent-subtle); color: var(--rux-accent); border-color: transparent; }
      .b.subtle-success { background: var(--rux-success-subtle); color: var(--rux-success); border-color: transparent; }
      .b.subtle-warning { background: var(--rux-warning-subtle); color: var(--rux-warning); border-color: transparent; }
      .b.subtle-danger  { background: var(--rux-danger-subtle); color: var(--rux-danger); border-color: transparent; }
      .b.subtle-info    { background: var(--rux-info-subtle); color: var(--rux-info); border-color: transparent; }
      .name { font-size: var(--rux-text-2xs); font-weight: var(--rux-weight-semibold); }
      .name-muted { color: var(--rux-fg-muted); }
      .val { font-family: var(--rux-font-mono); font-size: var(--rux-text-2xs); opacity: 0.7; margin-top: calc(var(--rux-space-1) / 2); }
    </style>
  </head>
  <body>
    <div class="b subtle-accent"><div class="name">accent-subtle</div><div class="val">tinted bg</div></div>
    <div class="b subtle-success"><div class="name">success-subtle</div><div class="val">tinted bg</div></div>
    <div class="b subtle-warning"><div class="name">warning-subtle</div><div class="val">tinted bg</div></div>
    <div class="b subtle-danger"><div class="name">danger-subtle</div><div class="val">tinted bg</div></div>
    <div class="b subtle-info"><div class="name">info-subtle</div><div class="val">tinted bg</div></div>
    <div class="b"><div class="name name-muted">+ default</div><div class="val">flat bg + border</div></div>
  </body>
</html>
