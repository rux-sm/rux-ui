<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/colors_and_type.css" />
    <style>
      body { padding: var(--rux-space-5); display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--rux-space-3); }
      .s { display: flex; flex-direction: column; gap: var(--rux-space-2); }
      .chip { height: calc(var(--rux-space-7) + var(--rux-space-2)); border-radius: var(--rux-radius-md); }
      .chip--accent { background: var(--rux-accent); }
      .chip--success { background: var(--rux-success); }
      .chip--warning { background: var(--rux-warning); }
      .chip--danger { background: var(--rux-danger); }
      .chip--info { background: var(--rux-info); }
      .name { font-size: var(--rux-text-2xs); font-weight: var(--rux-weight-semibold); }
      .val { font-family: var(--rux-font-mono); font-size: var(--rux-text-2xs); color: var(--rux-fg-subtle); }
    </style>
  </head>
  <body>
    <div class="s"><div class="chip chip--accent"></div><div class="name">accent</div><div class="val">brand blue</div></div>
    <div class="s"><div class="chip chip--success"></div><div class="name">success</div><div class="val">green</div></div>
    <div class="s"><div class="chip chip--warning"></div><div class="name">warning</div><div class="val">amber</div></div>
    <div class="s"><div class="chip chip--danger"></div><div class="name">danger</div><div class="val">red</div></div>
    <div class="s"><div class="chip chip--info"></div><div class="name">info</div><div class="val">cyan</div></div>
  </body>
</html>
