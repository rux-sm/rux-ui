<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/colors_and_type.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <style>
      body { padding: var(--rux-space-5); }
      .avatar-overlap { margin-right: calc(var(--rux-radius-md) * -1); }
      .avatar-info { background: var(--rux-info-subtle); color: var(--rux-info); }
    </style>
  </head>
  <body>
    <div class="rux-card">
      <div class="rux-card__header">
        <div>
          <div class="rux-card__title">Yosemite weekend</div>
          <div class="rux-card__subtitle">Sat, Mar 14 · 6:00am · 2 buses</div>
        </div>
        <span class="rux-badge rux-badge--success rux-badge--dot">Confirmed</span>
      </div>
      <div class="rux-card__footer rux-row">
        <div class="rux-avatar avatar-overlap">KR</div>
        <div class="rux-avatar avatar-info">JT</div>
        <div class="rux-spacer"></div>
        <button class="rux-button rux-button--ghost">Open</button>
      </div>
    </div>
  </body>
</html>
