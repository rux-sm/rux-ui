<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/colors_and_type.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <style>
      body { padding: var(--rux-space-5); display: flex; gap: var(--rux-space-6); align-items: center; }
      .group { display: flex; flex-direction: column; gap: var(--rux-space-3); }
      .label { font-size: var(--rux-text-2xs); color: var(--rux-fg-subtle); font-family: var(--rux-font-mono); }
      .row { display: flex; align-items: center; gap: var(--rux-space-3); }
    </style>
  </head>
  <body>
    <div class="group">
      <div class="label">switch</div>
      <div class="row">
        <label class="rux-switch"><input type="checkbox" checked /><span class="rux-switch__track"></span><span class="rux-switch__thumb"></span></label>
        <span class="rux-body-sm">On</span>
      </div>
      <div class="row">
        <label class="rux-switch"><input type="checkbox" /><span class="rux-switch__track"></span><span class="rux-switch__thumb"></span></label>
        <span class="rux-body-sm">Off</span>
      </div>
    </div>
    <div class="group">
      <div class="label">checkbox</div>
      <label class="rux-checkbox"><input type="checkbox" checked /> Selected</label>
      <label class="rux-checkbox"><input type="checkbox" /> Unselected</label>
    </div>
  </body>
</html>
