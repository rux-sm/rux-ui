<!doctype html>
<!-- @dsCard group="Spacing" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/colors_and_type.css" />
    <style>
      body { padding: var(--rux-space-5); display: flex; flex-direction: column; gap: var(--rux-space-2); }
      .row { display: flex; align-items: center; gap: var(--rux-space-3); }
      .name { font-family: var(--rux-font-mono); font-size: var(--rux-text-2xs); width: 100px; color: var(--rux-fg-muted); }
      .bar { height: var(--rux-icon-sm); background: var(--rux-accent); border-radius: var(--rux-radius-xs); }
      .bar--1 { width: var(--rux-space-1); }
      .bar--2 { width: var(--rux-space-2); }
      .bar--3 { width: var(--rux-space-3); }
      .bar--4 { width: var(--rux-space-4); }
      .bar--5 { width: var(--rux-space-5); }
      .bar--6 { width: var(--rux-space-6); }
      .bar--7 { width: var(--rux-space-7); }
      .bar--8 { width: var(--rux-space-8); }
      .val { font-family: var(--rux-font-mono); font-size: var(--rux-text-2xs); color: var(--rux-fg-subtle); }
    </style>
  </head>
  <body>
    <div class="row"><div class="name">space-1</div><div class="bar bar--1"></div><div class="val">4 px</div></div>
    <div class="row"><div class="name">space-2</div><div class="bar bar--2"></div><div class="val">8 px</div></div>
    <div class="row"><div class="name">space-3</div><div class="bar bar--3"></div><div class="val">12 px</div></div>
    <div class="row"><div class="name">space-4</div><div class="bar bar--4"></div><div class="val">16 px</div></div>
    <div class="row"><div class="name">space-5</div><div class="bar bar--5"></div><div class="val">24 px</div></div>
    <div class="row"><div class="name">space-6</div><div class="bar bar--6"></div><div class="val">32 px</div></div>
    <div class="row"><div class="name">space-7</div><div class="bar bar--7"></div><div class="val">48 px</div></div>
    <div class="row"><div class="name">space-8</div><div class="bar bar--8"></div><div class="val">64 px</div></div>
  </body>
</html>
