<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/colors_and_type.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
      body { padding: var(--rux-space-5); display: flex; gap: var(--rux-space-4); align-items: start; }
      .menu-demo { flex: none; }
      .stack-demo { flex: 1; }
      .progress-warning { background: var(--rux-warning); }
    </style>
  </head>
  <body>
    <div class="rux-menu menu-demo">
      <div class="rux-menu__header">Account</div>
      <button class="rux-menu__item">Profile</button>
      <button class="rux-menu__item is-active">Notifications</button>
      <button class="rux-menu__item">Settings</button>
      <div class="rux-menu__divider"></div>
      <button class="rux-menu__item rux-menu__item--danger">Sign out</button>
    </div>
    <div class="rux-stack stack-demo">
      <div class="rux-tabs">
        <button class="rux-tabs__tab is-active">Overview</button>
        <button class="rux-tabs__tab">Activity</button>
        <button class="rux-tabs__tab">Settings</button>
      </div>
      <div class="rux-progress"><div class="rux-progress__bar" style="width: 64%;"></div></div>
      <div class="rux-progress"><div class="rux-progress__bar progress-warning" style="width: 22%;"></div></div>
    </div>
  </body>
</html>
