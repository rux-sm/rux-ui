<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/colors_and_type.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <style>body { padding: var(--rux-space-5); display: flex; flex-direction: column; gap: var(--rux-space-3); }</style>
  </head>
  <body>
    <div class="rux-alert rux-alert--info">
      <div class="rux-alert__body"><div class="rux-alert__title">Schedule sync paused</div><div>Resumes when the connection returns.</div></div>
    </div>
    <div class="rux-alert rux-alert--success">
      <div class="rux-alert__body"><div class="rux-alert__title">All set</div><div>Drivers were notified.</div></div>
    </div>
    <div class="rux-alert rux-alert--warning">
      <div class="rux-alert__body"><div class="rux-alert__title">Driver overlap on Tuesday</div></div>
    </div>
    <div class="rux-alert rux-alert--danger">
      <div class="rux-alert__body"><div class="rux-alert__title">Couldn't save</div><div>Check your connection.</div></div>
    </div>
  </body>
</html>
