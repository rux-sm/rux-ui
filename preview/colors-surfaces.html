<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/colors_and_type.css" />
    <style>
      body { padding: var(--rux-space-5); display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--rux-space-3); }
      .s { display: flex; flex-direction: column; gap: var(--rux-space-2); }
      .chip { height: var(--rux-space-8); border-radius: var(--rux-radius-md); border: var(--rux-border-width) solid var(--rux-border); }
      .chip--bg { background: var(--rux-bg); }
      .chip--elevated { background: var(--rux-bg-elevated); }
      .chip--sunken { background: var(--rux-bg-sunken); }
      .chip--hover { background: var(--rux-bg-hover); }
      .name { font-size: var(--rux-text-2xs); font-weight: var(--rux-weight-semibold); }
      .val { font-family: var(--rux-font-mono); font-size: var(--rux-text-2xs); color: var(--rux-fg-subtle); }
    </style>
  </head>
  <body>
    <div class="s"><div class="chip chip--bg"></div><div class="name">bg</div><div class="val">#000000</div></div>
    <div class="s"><div class="chip chip--elevated"></div><div class="name">bg-elevated</div><div class="val">#1f1f1f</div></div>
    <div class="s"><div class="chip chip--sunken"></div><div class="name">bg-sunken</div><div class="val">#060606</div></div>
    <div class="s"><div class="chip chip--hover"></div><div class="name">bg-hover</div><div class="val">#292929</div></div>
  </body>
</html>
