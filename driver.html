<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#101112" />
		<title>Upcoming Trips · Escamilla Tour Buses</title>
		<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="./rux-ui/css/rux.css?v=119" />
		<link rel="stylesheet" href="./scheduler/css/components.css?v=248" />
		<link rel="stylesheet" href="./scheduler/css/features/trip-envelope.css?v=15" />
		<link rel="stylesheet" href="./scheduler/css/features/doc-viewer.css?v=8" />
		<link rel="stylesheet" href="./scheduler/css/features/driver-share.css?v=87" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap"
		/>
	</head>
	<body class="driver-share-page">
		<header class="rux-ui-header" aria-label="Application Header">
			<div class="rux-ui-header__brand">
				<img
					class="rux-ui-header__logo"
					src="./assets/logo.png"
					alt="Escamilla Tour Buses"
				/>
			</div>
			<h1 class="rux-ui-header__title">Driver Schedule</h1>
		</header>

		<main class="driver-share" id="driver-share-root">
			<section class="driver-share-skeleton" aria-label="Loading assignments" aria-busy="true">
				<div class="driver-share-skeleton__card">
					<div class="driver-share-skeleton__header">
						<div class="driver-share-skeleton__line"></div>
						<div class="driver-share-skeleton__line"></div>
					</div>
					<div class="driver-share-skeleton__module">
						<div class="driver-share-skeleton__line"></div>
						<div class="driver-share-skeleton__line"></div>
					</div>
					<div class="driver-share-skeleton__module">
						<div class="driver-share-skeleton__line"></div>
						<div class="driver-share-skeleton__line"></div>
					</div>
				</div>
			</section>
		</main>

		<div
			class="driver-share-announcer"
			id="driver-share-announcer"
			role="status"
			aria-live="polite"
			aria-atomic="true"
		></div>

		<dialog
			class="driver-share-dialog"
			id="driver-share-decline-dialog"
			aria-labelledby="driver-share-decline-title"
			aria-describedby="driver-share-decline-description"
		>
			<header class="driver-share-dialog__header">
				<h2 class="driver-share-dialog__title" id="driver-share-decline-title">
					Decline This Assignment?
				</h2>
			</header>
			<div class="driver-share-dialog__body">
				<p id="driver-share-decline-description">
					Dispatch will be notified that you are unable to take this trip.
				</p>
			</div>
			<footer class="driver-share-dialog__footer">
				<button class="rux-button rux-button--default" type="button" data-decline-cancel>
					Cancel
				</button>
				<button
					class="rux-button rux-button--accent rux-button--danger"
					type="button"
					data-decline-confirm
				>
					Decline Assignment
				</button>
			</footer>
		</dialog>

		<script type="module" src="./js/core/app-reload.js?v=2"></script>
		<script src="./rux-ui/js/controls.js?v=5"></script>
		<script src="./rux-ui/js/floating-window.js?v=5"></script>
		<script src="./rux-ui/js/boot.js?v=2"></script>
		<script src="./js/core/doc-viewer.js?v=13"></script>
		<script src="./js/core/address-format.js?v=2"></script>
		<script src="./js/panels/trip-envelope.js?v=17"></script>
		<script type="module" src="./js/pages/driver-share.js?v=72"></script>
	</body>
</html>
