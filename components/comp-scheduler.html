<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rux UI — Scheduler</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/colors_and_type.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <script
    
      src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"
      defer
    ></script>
    <link rel="stylesheet" href="../css/comp-scheduler-demo.css" />
  </head>
  <body class="scheduler-app-page">
    <main class="scheduler-app">
      <header class="scheduler-app__topbar" aria-label="App">
        <div class="scheduler-app__topbar-start">
          <nav class="scheduler-app__module-nav" aria-label="Main">
            <button
              class="rux-button rux-button--ghost scheduler-app__module-button is-active"
              type="button"
              aria-current="page"
            >
              <svg
                class="rux-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M8 2v4" />
                <path d="M16 2v4" />
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path d="M3 10h18" />
              </svg>
              Schedule
            </button>
            <button
              class="rux-button rux-button--ghost scheduler-app__module-button"
              type="button"
            >
              <i data-lucide="map" class="rux-icon"></i>
              Trips
            </button>
            <button
              class="rux-button rux-button--ghost scheduler-app__module-button"
              type="button"
            >
              <span class="rux-icon rux-icon--bus-side" aria-hidden="true"></span>
              Fleet
            </button>
            <button
              class="rux-button rux-button--ghost scheduler-app__module-button"
              type="button"
            >
              <i data-lucide="user" class="rux-icon"></i>
              Drivers
            </button>
            <button
              class="rux-button rux-button--ghost scheduler-app__module-button"
              type="button"
            >
              <svg
                class="rux-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 6h4" />
                <path d="M2 10h4" />
                <path d="M2 14h4" />
                <path d="M2 18h4" />
                <rect width="16" height="20" x="4" y="2" rx="2" />
                <path d="M15 2v20" />
                <path d="M15 7h5" />
                <path d="M15 12h5" />
                <path d="M15 17h5" />
              </svg>
              Customers
            </button>
          <button
              class="scheduler-app__profile"
              type="button"
              aria-label="Open Rux profile"
            >
              <img src="../assets/rux-profile-pic.png" alt="" />
            </button>
          </nav>
        </div>
        <div class="scheduler-app__account">
          <span class="scheduler-app__username">Rux</span>
          <button
            class="scheduler-app__profile"
            type="button"
            aria-label="Open Rux profile"
          >
            <img src="../assets/rux-profile-pic.png" alt="" />
          </button>
        </div>
      </header>

      <div class="scheduler-app__body">

        <!-- ── Trip panel drawer ─────────────────────────────────────── -->
        <div class="scheduler-app__drawer" id="trip-panel-drawer">
          <aside class="rux-trip-panel" role="dialog" aria-labelledby="trip-panel-title">
            <header class="rux-trip-panel__header">
              <div class="rux-trip-panel__heading">
                <h2 class="rux-trip-panel__title" id="trip-panel-title">Trip editor</h2>
                <span class="rux-trip-panel__id" id="tp-trip-id"></span>
              </div>
              <button class="rux-button rux-button--ghost rux-button--icon" id="tp-btn-close" aria-label="Close panel">
                <i data-lucide="x" class="rux-icon"></i>
              </button>
            </header>
            <nav class="rux-trip-panel__tabs" aria-label="Trip editor sections">
              <div class="rux-segmented rux-segmented--ghost" data-trip-tabs>
                <button class="rux-button" aria-selected="true" aria-controls="pane-trip" aria-label="Info" title="Info"><i data-lucide="info" class="rux-icon"></i><span class="rux-trip-panel__tab-label">Info</span></button>
                <button class="rux-button" aria-selected="false" aria-controls="pane-billing" aria-label="Bill" title="Bill"><i data-lucide="receipt" class="rux-icon"></i><span class="rux-trip-panel__tab-label">Bill</span></button>
                <button class="rux-button" aria-selected="false" aria-controls="pane-itinerary" aria-label="Route" title="Route"><span class="rux-icon rux-trip-panel__route-icon" aria-hidden="true"></span><span class="rux-trip-panel__tab-label">Route</span></button>
                <button class="rux-button" aria-selected="false" aria-controls="pane-dispatch" aria-label="Fleet" title="Fleet"><span class="rux-icon rux-trip-panel__fleet-icon" aria-hidden="true"></span><span class="rux-trip-panel__tab-label">Fleet</span></button>
                <button class="rux-button" aria-selected="false" aria-controls="pane-docs" aria-label="Docs" title="Docs"><i data-lucide="files" class="rux-icon"></i><span class="rux-trip-panel__tab-label">Docs</span></button>
              </div>
            </nav>
            <div class="rux-trip-panel__body">
              <!-- Trip -->
              <div id="pane-trip" class="rux-trip-panel__pane" role="tabpanel">
                <div class="rux-trip-panel__cols-2">
                  <div class="rux-field"><label class="rux-field__label" for="tp-customer">Customer</label><input class="rux-input" id="tp-customer" name="customer" type="text" placeholder="Customer name" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-destination">Destination</label><input class="rux-input" id="tp-destination" name="destination" type="text" placeholder="Destination" /></div>
                </div>
                <div class="rux-trip-panel__logistics-grid">
                  <div class="rux-field"><label class="rux-field__label" for="tp-start">Start date</label><input class="rux-input" id="tp-start" name="startDate" type="date" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-end">End date</label><input class="rux-input" id="tp-end" name="endDate" type="date" /></div>
                </div>
                <div class="rux-trip-panel__cols-2">
                  <div class="rux-field"><label class="rux-field__label" for="tp-dep">Departure</label><input class="rux-input" id="tp-dep" name="departureTime" type="time" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-return">Return</label><input class="rux-input" id="tp-return" name="returnTime" type="time" /></div>
                </div>
                <div class="rux-field"><label class="rux-field__label" for="tp-pickup">Pick-up address</label><input class="rux-input" id="tp-pickup" name="pickupAddress" type="text" placeholder="Street address" /></div>
                <div class="rux-trip-panel__cols-2">
                  <div class="rux-field"><label class="rux-field__label" for="tp-book-name">Name</label><input class="rux-input" id="tp-book-name" name="bookingContact.name" type="text" placeholder="Contact name" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-book-phone">Phone</label><input class="rux-input" id="tp-book-phone" name="bookingContact.phone" type="tel" placeholder="Phone number" /></div>
                </div>
                <div class="rux-field"><label class="rux-field__label" for="tp-book-email">Email</label><input class="rux-input" id="tp-book-email" name="bookingContact.email" type="email" placeholder="contact@example.com" /></div>
                <p class="rux-trip-panel__section-label">Trip options</p>
                <div class="rux-cluster">
                  <button class="rux-button rux-button--toggle" id="tp-one-way" type="button" aria-pressed="false" data-rux-toggle-button title="One way trip">One way</button>
                </div>
                <p class="rux-trip-panel__section-label">Vehicle requirements</p>
                <div class="rux-trip-panel__reqs" id="tp-vehicle-reqs"></div>
                <p class="rux-trip-panel__section-label">Driver needs</p>
                <div class="rux-cluster" id="tp-driver-needs"></div>
              </div>
              <!-- Billing -->
              <div id="pane-billing" class="rux-trip-panel__pane" role="tabpanel" hidden>
                <div class="rux-field"><label class="rux-field__label">Contract</label><div class="rux-segmented rux-trip-panel__status-group" id="tp-contract-group" data-rux-toggle-group><button class="rux-button is-active" aria-pressed="true" aria-label="Pending" title="Pending"><i data-lucide="clock" class="rux-icon"></i><span class="rux-trip-panel__status-label">Pending</span></button><button class="rux-button" aria-pressed="false" aria-label="N/A" title="N/A"><i data-lucide="ban" class="rux-icon"></i><span class="rux-trip-panel__status-label">N/A</span></button><button class="rux-button" aria-pressed="false" aria-label="Signed" title="Signed"><span class="rux-icon rux-trip-panel__signed-icon" aria-hidden="true"></span><span class="rux-trip-panel__status-label">Signed</span></button><button class="rux-button" aria-pressed="false" aria-label="PO" title="PO"><span class="rux-icon rux-trip-panel__po-icon" aria-hidden="true"></span><span class="rux-trip-panel__status-label">PO</span></button></div></div>
                <div class="rux-trip-panel__cols-2">
                  <div class="rux-field"><label class="rux-field__label" for="tp-price">Quoted price</label><div class="rux-input-group rux-input-group--prefix"><span class="rux-input-group__prefix">$</span><input class="rux-input" id="tp-price" name="quotedPrice" type="number" min="0" step="0.01" placeholder="0.00" /></div></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-est-mi">Est. miles</label><div class="rux-input-group rux-input-group--suffix"><input class="rux-input" id="tp-est-mi" name="estimatedMiles" type="number" min="0" /><span class="rux-input-group__suffix">mi</span></div></div>
                </div>
                <div class="rux-trip-panel__cols-2">
                  <div class="rux-field"><label class="rux-field__label" for="tp-drive-hr">Driving hours</label><div class="rux-input-group rux-input-group--suffix"><input class="rux-input" id="tp-drive-hr" name="estimatedDrivingHours" type="number" min="0" step="0.5" placeholder="0.0" /><span class="rux-input-group__suffix">hr</span></div></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-duty-hr">On-duty hours</label><div class="rux-input-group rux-input-group--suffix"><input class="rux-input" id="tp-duty-hr" name="estimatedOnDutyHours" type="number" min="0" step="0.5" placeholder="0.0" /><span class="rux-input-group__suffix">hr</span></div></div>
                </div>
                <div class="rux-field"><label class="rux-field__label">Invoice</label><div class="rux-segmented rux-trip-panel__status-group" id="tp-invoice-group" data-rux-toggle-group><button class="rux-button is-active" aria-pressed="true" aria-label="Pending" title="Pending"><i data-lucide="clock" class="rux-icon"></i><span class="rux-trip-panel__status-label">Pending</span></button><button class="rux-button" aria-pressed="false" aria-label="Invoiced" title="Invoiced"><span class="rux-icon rux-trip-panel__invoiced-icon" aria-hidden="true"></span><span class="rux-trip-panel__status-label">Invoiced</span></button><button class="rux-button" aria-pressed="false" aria-label="Deposit" title="Deposit"><span class="rux-icon rux-trip-panel__deposit-icon" aria-hidden="true"></span><span class="rux-trip-panel__status-label">Deposit</span></button><button class="rux-button" aria-pressed="false" aria-label="Paid" title="Paid"><i data-lucide="circle-check" class="rux-icon"></i><span class="rux-trip-panel__status-label">Paid</span></button></div></div>
                <div class="rux-trip-panel__cols-2">
                  <div class="rux-field"><label class="rux-field__label" for="tp-po">PO / ref</label><input class="rux-input" id="tp-po" name="paymentRef" type="text" placeholder="PO / ref" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-inv-num">Invoice number</label><input class="rux-input" id="tp-inv-num" name="invoiceNumber" type="text" placeholder="INV-" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-date-paid">Date paid</label><input class="rux-input" id="tp-date-paid" name="datePaid" type="date" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-act-mi">Actual miles</label><div class="rux-input-group rux-input-group--suffix"><input class="rux-input" id="tp-act-mi" name="actualMiles" type="number" min="0" /><span class="rux-input-group__suffix">mi</span></div></div>
                </div>
                <div class="rux-field"><label class="rux-field__label">Payment refs</label><div class="rux-trip-panel__refs"><input class="rux-input" id="tp-pay-ref-1" name="paymentRef1" type="text" placeholder="Ref 1" /><input class="rux-input" id="tp-pay-ref-2" name="paymentRef2" type="text" placeholder="Ref 2" hidden /><input class="rux-input" id="tp-pay-ref-3" name="paymentRef3" type="text" placeholder="Ref 3" hidden /></div></div>
              </div>
              <!-- Itinerary -->
              <div id="pane-itinerary" class="rux-trip-panel__pane rux-trip-panel__pane--flush" role="tabpanel" hidden>
                <div class="rux-itin" id="tp-itin">
                  <div class="rux-itin__summary" id="tp-itin-summary"></div>
                  <div class="rux-itin__stops" id="tp-itin-stops"></div>
                  <div class="rux-itin__actions">
                    <button class="rux-button rux-button--secondary" type="button" id="tp-itin-add-stop" title="Add stop"><i data-lucide="map-pin" class="rux-icon"></i><span class="rux-btn-label">Stop</span></button>
                    <button class="rux-button rux-button--secondary" type="button" id="tp-itin-add-sleeper" title="Add sleep"><i data-lucide="bed" class="rux-icon"></i><span class="rux-btn-label">Sleep</span></button>
                    <button class="rux-button rux-button--secondary" type="button" id="tp-itin-add-day" title="End day"><i data-lucide="calendar-x" class="rux-icon"></i><span class="rux-btn-label">End</span></button>
                    <button class="rux-button rux-button--secondary" type="button" id="tp-itin-add-return" title="Add return"><i data-lucide="undo-2" class="rux-icon"></i><span class="rux-btn-label">Return</span></button>
                    <button class="rux-button rux-button--secondary" type="button" id="tp-itin-recalc" title="Recalculate route"><i data-lucide="route" class="rux-icon"></i><span class="rux-btn-label">Route</span></button>
                  </div>
                </div>
              </div>
              <!-- Dispatch -->
              <div id="pane-dispatch" class="rux-trip-panel__pane" role="tabpanel" hidden>
                <div class="rux-trip-panel__fleet-count-card">
                  <span class="rux-trip-panel__fleet-count-label" id="tp-buses-label">Buses Needed</span>
                  <div class="rux-trip-panel__number-picker" role="group" aria-labelledby="tp-buses-label">
                    <button class="rux-button rux-button--ghost rux-button--icon rux-button--sm rux-trip-panel__number-btn" type="button" data-bus-count-dec aria-label="Fewer buses"><i data-lucide="minus" class="rux-icon"></i></button>
                    <input class="rux-input rux-trip-panel__number-input" id="tp-buses" name="busesNeeded" type="number" min="1" max="20" step="1" value="1" inputmode="numeric" aria-labelledby="tp-buses-label" />
                    <button class="rux-button rux-button--ghost rux-button--icon rux-button--sm rux-trip-panel__number-btn" type="button" data-bus-count-inc aria-label="More buses"><i data-lucide="plus" class="rux-icon"></i></button>
                  </div>
                </div>
                <div class="rux-trip-panel__bus-groups" id="tp-bus-groups"></div>
              </div>
              <!-- Docs -->
              <div id="pane-docs" class="rux-trip-panel__pane" role="tabpanel" hidden>
                <div class="rux-trip-panel__doc-upload">
                  <button class="rux-button" id="tp-doc-upload-btn" type="button"><i data-lucide="upload" class="rux-icon"></i> Upload</button>
                  <input type="file" id="tp-doc-file-input" hidden accept="*/*" />
                  <div class="rux-trip-panel__doc-label-pick" id="tp-doc-label-pick" hidden>
                    <select class="rux-select" id="tp-doc-label-select"><option value="" disabled selected>Label…</option><option value="Quote">Quote</option><option value="PO">PO</option><option value="Itinerary">Itinerary</option><option value="Contract">Contract</option><option value="Permit">Permit</option><option value="Other">Other</option></select>
                    <button class="rux-button rux-button--primary" id="tp-doc-add-btn" type="button">Add</button>
                    <button class="rux-button rux-button--ghost" id="tp-doc-cancel-btn" type="button">Cancel</button>
                  </div>
                </div>
                <ul class="rux-trip-panel__doc-list" id="tp-doc-list"></ul>
                <div class="rux-field"><label class="rux-field__label" for="tp-notes">Notes</label><input class="rux-input" id="tp-notes" name="notes" type="text" placeholder="Operational notes…" /></div>
                <p class="rux-trip-panel__section-label">Trip contacts</p>
                <div class="rux-trip-panel__cols-2">
                  <div class="rux-field"><label class="rux-field__label" for="tp-trip-name">Name</label><input class="rux-input" id="tp-trip-name" name="tripContact.name" type="text" placeholder="On-site contact" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-trip-phone">Phone</label><input class="rux-input" id="tp-trip-phone" name="tripContact.phone" type="tel" /></div>
                </div>
                <div class="rux-trip-panel__cols-2">
                  <div class="rux-field"><label class="rux-field__label" for="tp-trip2-name">Name</label><input class="rux-input" id="tp-trip2-name" name="tripContact2.name" type="text" placeholder="Secondary contact" /></div>
                  <div class="rux-field"><label class="rux-field__label" for="tp-trip2-phone">Phone</label><input class="rux-input" id="tp-trip2-phone" name="tripContact2.phone" type="tel" /></div>

            <footer class="rux-trip-panel__footer">

          </aside>
          <div class="scheduler-app__drawer-handle" aria-hidden="true"></div>

        <!-- /trip-panel-drawer -->

            <div class="rux-scheduler__day-head">Sat</div>

        </div>
        </section>
      </div>
    </main>
    <div class="scheduler-app__context-menu" id="scheduler-context-menu" role="menu" hidden>
      <button class="scheduler-app__context-item" id="scheduler-context-add-trip" type="button" role="menuitem">
        <i data-lucide="plus" class="rux-icon"></i>
        <span>Add trip</span>
      </button>
    </div>

    <script src="../js/utilities.js"></script>
    <script src="../js/controls.js" defer></script>
    <script src="../js/trip-panel.js"></script>
    <script src="../js/itinerary.js"></script>

    <script type="module">
      import { createTripBar } from "../js/trip-bar.js";

      /* ── Trip panel drawer ───────────────────────────────────────────── */
      const drawer = document.getElementById("trip-panel-drawer");
      const tripPanel = drawer.querySelector(".rux-trip-panel");
      const schedulerEl = document.getElementById("scheduler");
      const schedulerContextMenu = document.getElementById("scheduler-context-menu");
      const schedulerContextAddTrip = document.getElementById("scheduler-context-add-trip");
      let loadTrip = null;
      let newTrip = null;
      let fetchTrips = null;
      let pendingNewTripContext = null;

      function openDrawer() { drawer.classList.add("is-open"); }
      function closeDrawer() { drawer.classList.remove("is-open"); }

      document.querySelector(".scheduler-app__view-menu")
        .addEventListener("click", () => drawer.classList.toggle("is-open"));

      document.getElementById("tp-btn-close")
        .addEventListener("click", closeDrawer);

      function setActiveTripPane(panelId) {
        const tab = tripPanel.querySelector(`.rux-trip-panel__tabs .rux-button[aria-controls="${panelId}"]`);
        tab?.click();
      }

      function closeSchedulerContextMenu() {
        schedulerContextMenu.hidden = true;
        pendingNewTripContext = null;
      }

      function positionSchedulerContextMenu(event) {
        schedulerContextMenu.hidden = false;
        const rect = schedulerContextMenu.getBoundingClientRect();
        const inline = Math.min(event.clientX, window.innerWidth - rect.width - 8);
        const block = Math.min(event.clientY, window.innerHeight - rect.height - 8);
        schedulerContextMenu.style.left = `${Math.max(8, inline)}px`;
        schedulerContextMenu.style.top = `${Math.max(8, block)}px`;
      }

      function trackIdForBusNumber(number) {
        return `track-${String(number ?? "").replace(/[^A-Za-z0-9_-]/g, "_")}`;
      }

      function busNumberFromTrack(track) {
        return track?.dataset.busNumber || String(track?.id || "").replace(/^track-/, "");
      }

      function contextFromTrackEvent(event, track) {
        const rect = track.getBoundingClientRect();
        const days = schedulerDayCount(track);
        const dayIndex = Math.max(
          0,
          Math.min(days - 1, Math.floor(((event.clientX - rect.left) / rect.width) * days)),
        );
        const date = isoDate(addDays(currentWeekStart, dayIndex));
        const busNumber = busNumberFromTrack(track);
        return { date, busNumber };
      }

      function syncBusCount(value) {
        const busesInput = tripPanel.querySelector("#tp-buses");
        if (!busesInput) return;
        const nextValue = Math.max(1, Math.min(20, parseInt(value, 10) || 1));
        busesInput.value = String(nextValue);
        busesInput.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function prefillNewTripFromContext({ date, busNumber }) {
        tripPanel.querySelector("#tp-start").value = date;
        tripPanel.querySelector("#tp-end").value = date;
        syncBusCount(1);

        const busSelect = tripPanel.querySelector('[name="buses[0].busId"]');
        if (!busSelect || !busNumber) return;
        const option = [...busSelect.options].find((opt) =>
          opt.value === busNumber || opt.textContent.trim() === busNumber
        );
        if (option) {
          busSelect.value = option.value;
          busSelect.dispatchEvent(new Event("change", { bubbles: true }));
        }
      }

      function startNewTripFromContext(context) {
        if (!newTrip) return;
        newTrip(tripPanel, itinerary);
        prefillNewTripFromContext(context);
        setActiveTripPane("pane-trip");
        openDrawer();
      }

      // Hoist date constants so the calendar renders before any async work
      const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const dayHeadEls = document.querySelectorAll(".rux-scheduler__day-head");
      const todayIso = isoDate(new Date());
      let currentWeekStart = startOfWeek(new Date());

      renderDayHeaders(currentWeekStart);

      // Process static HTML icons immediately — before any async work
      if (window.lucide) lucide.createIcons();

      TripPanel.init(tripPanel);
      const itinerary = Itinerary.init(tripPanel);

      /* ── Resizable drawer ────────────────────────────────────────────── */
      const DRAWER_MIN = 320;
      const DRAWER_MAX = 640;
      const DRAWER_STORAGE_KEY = "rux-drawer-width";

      const savedDrawerWidth = localStorage.getItem(DRAWER_STORAGE_KEY);
      if (savedDrawerWidth) drawer.style.setProperty("--drawer-width", savedDrawerWidth + "px");

      drawer.querySelector(".scheduler-app__drawer-handle").addEventListener("mousedown", (e) => {
        e.preventDefault();
        drawer.classList.add("is-resizing");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
        const startX = e.clientX;
        const startW = parseInt(getComputedStyle(drawer).getPropertyValue("--drawer-width")) || drawer.offsetWidth;

        const onMove = (e) => {
          const w = Math.min(DRAWER_MAX, Math.max(DRAWER_MIN, startW + e.clientX - startX));
          drawer.style.setProperty("--drawer-width", w + "px");
        };

        const onUp = () => {
          drawer.classList.remove("is-resizing");
          document.body.style.cursor = "";
          document.body.style.userSelect = "";
          const w = parseInt(getComputedStyle(drawer).getPropertyValue("--drawer-width"));
          if (w) localStorage.setItem(DRAWER_STORAGE_KEY, w);
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
        };

        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });

      schedulerEl.addEventListener("contextmenu", (event) => {
        const track = event.target.closest(".rux-scheduler__track");
        if (!track || event.target.closest(".rux-trip-bar")) {
          closeSchedulerContextMenu();
          return;
        }

        event.preventDefault();
        pendingNewTripContext = contextFromTrackEvent(event, track);
        positionSchedulerContextMenu(event);
        if (window.lucide) lucide.createIcons();
      });

      schedulerContextAddTrip.addEventListener("click", () => {
        const context = pendingNewTripContext;
        closeSchedulerContextMenu();
        if (context) startNewTripFromContext(context);
      });

      document.addEventListener("click", (event) => {
        if (!schedulerContextMenu.hidden && !schedulerContextMenu.contains(event.target)) {
          closeSchedulerContextMenu();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSchedulerContextMenu();
      });

      schedulerEl.addEventListener("scroll", closeSchedulerContextMenu);

      const callbacks = {
        onOpenTrip: (trip) => {
          openDrawer();
          if (loadTrip) loadTrip(tripPanel, itinerary, trip);
        },
        onChangeBus: (trip) => console.log("change bus", trip.id),
        onUploadPdf: (trip) => console.log("upload pdf", trip.id),
        onViewPdf: (trip) => console.log("view pdf", trip.id),
        onSendInfo: (trip) => console.log("send info", trip.id),
        onTripEnvelope: (trip) => console.log("trip envelope", trip.id),
        onOther: (trip) => console.log("other options", trip.id),
      };

      // ── Trip requirements config ──────────────────────────────────────
      // Customize per business deployment. Keys must be unique strings (no spaces).
      // The trip editor renders these as toggles, 3 per row — keep under ~15 for a usable form.
      // Trip objects store active keys as: requirements: ["sleeper", "adaLift"]
      const TRIP_REQUIREMENTS = [
        { key: "sleeper",   label: "Sleeper",    icon: "moon"           },
        { key: "pax56",     label: "56 pax",     icon: "users"          },
        { key: "hotel",     label: "Hotel",      icon: "building"       },
        { key: "adaLift",   label: "ADA lift",   icon: "accessibility"  },
        { key: "fuelCard",  label: "Fuel card",  icon: "credit-card"    },
        // add more requirements here
      ];

      const trips = {};
      const tripTrackMap = {};
      let schedulerBuses = [];

      async function loadTripsFromDB() {
        if (!fetchTrips) return;

        let data;
        try {
          data = await fetchTrips();
        } catch (err) {
          console.error("Failed to load trips:", err);
          return;
        }

        Object.keys(trips).forEach(k => delete trips[k]);
        Object.keys(tripTrackMap).forEach(k => delete tripTrackMap[k]);

        data.forEach(t => {
          (t.trip_assignments ?? []).forEach(assignment => {
            if (!assignment.buses) return;
            const key = assignment.id;
            const primaryDriver = (assignment.drivers ?? []).find(d => d.role === "driver");

            trips[key] = {
              id:            t.id,
              trip_ref:      t.trip_ref,
              assignmentId:  assignment.id,
              busId:         assignment.bus_id,
              assignments:   (t.trip_assignments ?? []).map(a => ({
                bus_id:   a.bus_id,
                position: a.position,
                drivers:  a.drivers ?? [],
              })),
              trip_stops:    t.trip_stops ?? [],
              startDate:     t.start_date,
              endDate:       t.end_date,
              trip_type:     t.trip_type,
              destination:   t.destination,
              customer:      t.customer,
              departureTime: t.departure_time,
              spotTime:      t.spot_time,
              returnTime:    t.return_time,
              notes:         t.notes,
              bookingContact: { name: t.booking_contact_name, phone: t.booking_contact_phone, email: t.booking_contact_email },
              bus_count:     t.bus_count,
              req_sleeper:   t.req_sleeper, req_56pax: t.req_56pax, req_ada: t.req_ada,
              need_hotel:    t.need_hotel, need_fuel_card: t.need_fuel_card,
              confirmed:     t.confirmed,
              invoiceStatus: t.invoice_status,
              paymentStatus: t.contract_status,
              estimatedMiles: t.est_miles,
              actualMiles:   t.actual_miles,
              quotedPrice:   t.quoted_price,
              paymentRef:    t.po_ref,
              invoiceNumber: t.invoice_number,
              datePaid:      t.date_paid,
              paymentRefs:   [t.payment_ref_1, t.payment_ref_2, t.payment_ref_3].filter(Boolean),
              drivers: (assignment.drivers ?? []).map(td => ({
                name:      td.drivers?.name,
                shortName: td.drivers?.short_name || td.drivers?.name,
                status:    "confirmed",
                pay:       td.pay != null ? `$${td.pay}` : "",
              })),
              driverId: primaryDriver?.driver_id ?? null,
            };
            const trackId = trackIdForBusNumber(assignment.buses.number);
            if (!document.getElementById(trackId)) return;
            tripTrackMap[key] = { trackId, lane: 0 };
          });
        });

        renderScheduler();
      }

      tripPanel.addEventListener("rux:trip-saved",   () => loadTripsFromDB());
      tripPanel.addEventListener("rux:trip-deleted", () => loadTripsFromDB());

      const root = document.documentElement;

      function parseIsoDate(value) {
        if (value instanceof Date) return new Date(value);
        const match = String(value || "").match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/,
        );
        if (!match) return new Date(value);
        return new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3]),
        );
      }

      function startOfWeek(date) {
        const d = new Date(date);
        const day = d.getDay();
        d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
      }

      function isoDate(date) {
        const d = new Date(date);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function fmtWeekLabel(weekStart) {
        const weekEnd = addDays(weekStart, 6);
        const dateOptions = { month: "short", day: "numeric" };
        const start = weekStart.toLocaleDateString("en-US", dateOptions);
        const end = weekEnd.toLocaleDateString("en-US", {
          ...dateOptions,
          year: "numeric",
        });
        return `${start} - ${end}`;
      }

      function fmtWeekLabelShort(weekStart) {
        const weekEnd = addDays(weekStart, 6);
        const sameMonth = weekStart.getMonth() === weekEnd.getMonth();
        const mo = { month: "short" };
        const yr = String(weekEnd.getFullYear()).slice(-2);
        const startStr = weekStart.toLocaleDateString("en-US", { ...mo, day: "numeric" });
        const endStr = sameMonth
          ? `${weekEnd.getDate()}, ${yr}`
          : `${weekEnd.toLocaleDateString("en-US", { ...mo, day: "numeric" })}, ${yr}`;
        return `${startStr} - ${endStr}`;
      }

      // Bus label: "1/3", "2/3", "3/3" — auto-computed from tripGroupId + track order.
      // trackOrder is populated by renderScheduler() each render (top-to-bottom track IDs).
      // Returns "" for single-bus trips (no tripGroupId).
      let trackOrder = [];

      function computeBusLabel(tripKey) {
        const trip = trips[tripKey];
        if (!trip.tripGroupId) return "";

        const groupKeys = Object.keys(trips)
          .filter(k => trips[k].tripGroupId === trip.tripGroupId);
        if (groupKeys.length <= 1) return "";

        const sorted = [...groupKeys].sort((a, b) => {
          const posA = trackOrder.indexOf(tripTrackMap[a]?.trackId ?? "");
          const posB = trackOrder.indexOf(tripTrackMap[b]?.trackId ?? "");
          return (posA < 0 ? Infinity : posA) - (posB < 0 ? Infinity : posB);
        });

        const pos = sorted.indexOf(tripKey) + 1;
        return `${pos}/${sorted.length}`;
      }

      // Trip ID: YYMMDD-NN (departure date + 2-digit per-day sequence, max 99/day)
      // Immutable once assigned — editing departure date does not regenerate the ID.
      function generateTripId(departureDate) {
        if (!departureDate) throw new Error("departureDate required");
        const [y, m, d] = departureDate.split("-");
        const prefix = y.slice(2) + m + d; // "2026-06-07" → "260607"

        // max+1 keeps IDs unique even after deletions
        const maxSeq = Object.values(trips)
          .map(t => t.id)
          .filter(id => id.startsWith(prefix + "-"))
          .map(id => parseInt(id.split("-")[1], 10))
          .filter(n => Number.isFinite(n) && n > 0)
          .reduce((max, n) => Math.max(max, n), 0);

        if (maxSeq >= 99) throw new Error(`ID sequence full for ${prefix} (max 99/day)`);
        return `${prefix}-${String(maxSeq + 1).padStart(2, "0")}`;
      }

      function renderDayHeaders(weekStart) {
        const weekLabelEl = document.getElementById("week-label");
        weekLabelEl.textContent = fmtWeekLabel(weekStart);
        weekLabelEl.dataset.short = fmtWeekLabelShort(weekStart);
        dayHeadEls.forEach((el, index) => {
          const date = addDays(weekStart, index);
          el.textContent = `${DAY_NAMES[index]} ${date.getDate()}`;
          el.classList.toggle(
            "rux-scheduler__day-head--today",
            isoDate(date) === todayIso,
          );
        });
      }

      function rangesOverlap(a, b) {
        const aEnd = a.start + a.span - 1;
        const bEnd = b.start + b.span - 1;
        return a.start <= bEnd && b.start <= aEnd;
      }

      function assignLanes(placements) {
        const tracks = new Map();

        [...placements]
          .sort(
            (a, b) =>
              a.trackId.localeCompare(b.trackId) ||
              a.lane - b.lane ||
              a.start - b.start,
          )
          .forEach((placement) => {
            const lanes = tracks.get(placement.trackId) || [];
            let lane = 0;
            while (
              lanes[lane]?.some((entry) => rangesOverlap(entry, placement))
            ) {
              lane += 1;
            }

            placement.lane = lane;
            lanes[lane] = [...(lanes[lane] || []), placement];
            tracks.set(placement.trackId, lanes);
          });

        return placements;
      }

      function getWeekPlacements(weekStart, tripMap) {
        const weekEnd = addDays(weekStart, 6);
        const placements = [];

        Object.entries(tripTrackMap).forEach(([key, info]) => {
          const trip = tripMap[key];
          if (!trip?.startDate) return;

          const tripStart = parseIsoDate(trip.startDate);
          const tripEnd = parseIsoDate(trip.endDate || trip.startDate);
          if (tripEnd < weekStart || tripStart > weekEnd) return;

          const visibleStart = tripStart < weekStart ? weekStart : tripStart;
          const visibleEnd = tripEnd > weekEnd ? weekEnd : tripEnd;
          const start = Math.round((visibleStart - weekStart) / 864e5) + 1;
          const span = Math.round((visibleEnd - visibleStart) / 864e5) + 1;
          const fromPrev = tripStart < weekStart;
          const toNext = tripEnd > weekEnd;

          placements.push({
            trip: { ...trip, fromPrev, toNext },
            trackId: info.trackId,
            lane: info.lane,
            start,
            span,
            fromPrev,
            toNext,
          });
        });

        return assignLanes(placements);
      }

      function buildTrackGrid(track) {
        if (track.querySelector(".rux-scheduler__track-grid")) return;
        const grid = document.createElement("div");
        grid.className = "rux-scheduler__track-grid";
        grid.setAttribute("aria-hidden", "true");
        const days = schedulerDayCount(track);

        for (let day = 0; day < days; day += 1) {
          const cell = document.createElement("span");
          cell.className = "rux-scheduler__track-day";
          grid.appendChild(cell);
        }

        track.appendChild(grid);
      }

      function renderBusRows(buses = []) {
        schedulerEl.querySelectorAll(".rux-scheduler__row").forEach((row) => row.remove());

        buses.forEach((bus) => {
          const number = String(bus.number ?? "").trim();
          if (!number) return;

          const row = document.createElement("div");
          row.className = "rux-scheduler__row";

          const head = document.createElement("div");
          head.className = "rux-scheduler__row-head";
          head.setAttribute(
            "aria-label",
            bus.capacity ? `Bus ${number}, ${bus.capacity} pax` : `Bus ${number}`,
          );

          const numberEl = document.createElement("span");
          numberEl.className = "rux-scheduler__bus-number";
          numberEl.setAttribute("aria-hidden", "true");
          [...number].forEach((char) => {
            const charEl = document.createElement("span");
            charEl.textContent = char;
            numberEl.appendChild(charEl);
          });
          head.appendChild(numberEl);

          if (bus.capacity) {
            const paxEl = document.createElement("span");
            paxEl.className = "rux-scheduler__bus-pax";
            paxEl.textContent = `${bus.capacity} pax`;
            head.appendChild(paxEl);
          }

          const track = document.createElement("div");
          track.className = "rux-scheduler__track";
          track.id = trackIdForBusNumber(number);
          track.dataset.busId = bus.id;
          track.dataset.busNumber = number;

          row.append(head, track);
          schedulerEl.appendChild(row);
          buildTrackGrid(track);
        });

        trackOrder = buses.map((bus) => trackIdForBusNumber(bus.number)).filter((trackId) => document.getElementById(trackId));
        renderScheduler();
      }

      function tokenPx(name) {
        const rootSize = Number.parseFloat(getComputedStyle(root).fontSize);
        const value = getComputedStyle(root).getPropertyValue(name).trim();
        if (value.endsWith("rem")) return Number.parseFloat(value) * rootSize;
        if (value.endsWith("px")) return Number.parseFloat(value);
        return Number.parseFloat(value) || 0;
      }

      function schedulerDayCount(track) {
        const scheduler = track.closest(".rux-scheduler");
        return (
          Number.parseFloat(
            getComputedStyle(scheduler).getPropertyValue(
              "--rux-scheduler-days",
            ),
          ) || 7
        );
      }

      function placeInline(bar, placement) {
        const days = schedulerDayCount(bar.parentElement);
        const dayPct = 100 / days;
        const startPct = (placement.start - 1) * dayPct;
        const spanPct = placement.span * dayPct;
        const fromPrev = placement.fromPrev || placement.trip.fromPrev;
        const toNext = placement.toNext || placement.trip.toNext;

        bar.style.left = "";
        bar.style.right = "";
        bar.style.width = "";

        if (fromPrev && toNext) {
          bar.style.left = "var(--rux-space-2)";
          bar.style.right = "var(--rux-space-2)";
          bar.style.width = "auto";
          return;
        }

        if (fromPrev) {
          bar.style.left = "var(--rux-space-2)";
          bar.style.width = `calc(${spanPct}% - var(--rux-space-4))`;
          return;
        }

        bar.style.left = `calc(${startPct}% + var(--rux-space-2))`;
        if (toNext) {
          bar.style.right = "var(--rux-space-2)";
          bar.style.width = "auto";
        } else {
          bar.style.width = `calc(${spanPct}% - var(--rux-space-4))`;
        }
      }

      function layoutTrack(track) {
        const entries = activePlacements
          .filter((placement) => placement.trackId === track.id)
          .sort((a, b) => a.lane - b.lane || a.start - b.start);
        const row = track.closest(".rux-scheduler__row");
        if (!entries.length) {
          row.style.removeProperty("--_row-height");
          return;
        }

        const inset = tokenPx("--rux-space-2");
        const gap = tokenPx("--rux-space-2");
        const days = schedulerDayCount(track);
        const dayInlineSize = track.clientWidth / days - inset * 2;
        const lanes = [...new Set(entries.map((entry) => entry.lane))].sort(
          (a, b) => a - b,
        );
        let y = inset;

        lanes.forEach((lane, index) => {
          const laneEntries = entries.filter((entry) => entry.lane === lane);
          laneEntries.forEach((entry) => {
            entry.bar.style.setProperty(
              "--rux-trip-bar-day-inline-size",
              `${dayInlineSize}px`,
            );
            placeInline(entry.bar, entry);
            entry.bar.style.top = `${y}px`;
          });
          const laneHeight = Math.max(
            ...laneEntries.map((entry) => entry.bar.offsetHeight),
          );
          y += laneHeight;
          if (index < lanes.length - 1) y += gap;
        });

        row.style.setProperty("--_row-height", `${y + inset}px`);
      }

      let activePlacements = [];
      let activeObservers = [];
      let layoutFrame = 0;

      function layoutScheduler() {
        cancelAnimationFrame(layoutFrame);
        layoutFrame = requestAnimationFrame(() => {
          document
            .querySelectorAll(".rux-scheduler__track")
            .forEach((track) => layoutTrack(track));
        });
      }

      function renderScheduler() {
        activeObservers.forEach((observer) => observer.disconnect());
        activeObservers = [];

        document
          .querySelectorAll(".rux-scheduler__track .rux-trip-bar")
          .forEach((bar) => bar.remove());

        activePlacements = getWeekPlacements(currentWeekStart, trips);
        activePlacements.forEach((placement) => {
          const track = document.getElementById(placement.trackId);
          if (!track) return;
          const bar = createTripBar(placement.trip, callbacks);
          placement.bar = bar;
          track.appendChild(bar);
        });
        activePlacements = activePlacements.filter((placement) => placement.bar);

        renderDayHeaders(currentWeekStart);
        activePlacements.forEach((placement) => {
          const observer = new ResizeObserver(layoutScheduler);
          observer.observe(placement.bar);
          activeObservers.push(observer);
        });
        layoutScheduler();
      }

      window.addEventListener("resize", layoutScheduler);

      document.getElementById("prev-week").addEventListener("click", () => {
        currentWeekStart = addDays(currentWeekStart, -7);
        renderScheduler();
      });

      document.getElementById("next-week").addEventListener("click", () => {
        currentWeekStart = addDays(currentWeekStart, 7);
        renderScheduler();
      });

      document.getElementById("today-btn").addEventListener("click", () => {
        currentWeekStart = startOfWeek(new Date());
        renderScheduler();
      });

      renderScheduler();

      async function initSchedulerData() {
        try {
          const db = await import("../js/trip-db.js");
          loadTrip = db.loadTrip;
          newTrip = db.newTrip;
          fetchTrips = db.fetchTrips;

          // Wire save/clear/delete immediately — don't wait for buses/drivers
          db.initTripDB(tripPanel, itinerary);

          let buses = [];
          let drivers = [];

          try {
            buses = await db.fetchBuses();
          } catch (err) {
            console.warn("Could not load buses from DB:", err);
          }

          schedulerBuses = buses;
          renderBusRows(schedulerBuses);

          try {
            drivers = await db.fetchDrivers();
          } catch (err) {
            console.warn("Could not load drivers from DB:", err);
          }

          TripPanel.updateOptions(tripPanel, { buses, drivers });
          if (window.lucide) lucide.createIcons();
          await loadTripsFromDB();
        } catch (err) {
          console.warn("Could not initialize trip DB:", err);
        }
      }

      initSchedulerData();

      window.schedulerDemo = {
        trips,
        TRIP_REQUIREMENTS,
        get placements() { return activePlacements; },
        get weekStart()  { return currentWeekStart; },
        layoutScheduler,
        renderScheduler,
        generateTripId,
        computeBusLabel,
      };
    </script>
  </body>
