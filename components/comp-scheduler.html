      const tripTrackMap = {
        southPadre: { trackId: "track-218", lane: 0 },

      const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const dayHeadEls = document.querySelectorAll(".rux-scheduler__day-head");
      const todayIso = isoDate(new Date());
      const root = document.documentElement;

      function parseIsoDate(value) {
        if (value instanceof Date) return new Date(value);
        const match = String(value || "").match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})$/,
        );
        if (!match) return new Date(value);
        return new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3]),
        );
      }

      function startOfWeek(date) {
        const d = new Date(date);
        const day = d.getDay();
        d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
      }

      function isoDate(date) {
        const d = new Date(date);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function fmtWeekLabel(weekStart) {
        const weekEnd = addDays(weekStart, 6);
        const dateOptions = { month: "short", day: "numeric" };
        const start = weekStart.toLocaleDateString("en-US", dateOptions);
        const end = weekEnd.toLocaleDateString("en-US", {
          ...dateOptions,
          year: "numeric",
        });
        return `${start} - ${end}`;
      }

      // Bus label: "1/3", "2/3", "3/3" — auto-computed from tripGroupId + track order.
      // trackOrder is populated by renderScheduler() each render (top-to-bottom track IDs).
      // Returns "" for single-bus trips (no tripGroupId).
      let trackOrder = [];

      function computeBusLabel(tripKey) {
        const trip = trips[tripKey];
        if (!trip.tripGroupId) return "";

        const groupKeys = Object.keys(trips)
          .filter(k => trips[k].tripGroupId === trip.tripGroupId);
        if (groupKeys.length <= 1) return "";

        const sorted = [...groupKeys].sort((a, b) => {
          const posA = trackOrder.indexOf(tripTrackMap[a]?.trackId ?? "");
          const posB = trackOrder.indexOf(tripTrackMap[b]?.trackId ?? "");
          return (posA < 0 ? Infinity : posA) - (posB < 0 ? Infinity : posB);
        });

        const pos = sorted.indexOf(tripKey) + 1;
        return `${pos}/${sorted.length}`;
      }

      // Trip ID: YYMMDD-NN (departure date + 2-digit per-day sequence, max 99/day)
      // Immutable once assigned — editing departure date does not regenerate the ID.
      function generateTripId(departureDate) {
        if (!departureDate) throw new Error("departureDate required");
        const [y, m, d] = departureDate.split("-");
        const prefix = y.slice(2) + m + d; // "2026-06-07" → "260607"

        // max+1 keeps IDs unique even after deletions
        const maxSeq = Object.values(trips)
          .map(t => t.id)
          .filter(id => id.startsWith(prefix + "-"))
          .map(id => parseInt(id.split("-")[1], 10))
          .filter(n => Number.isFinite(n) && n > 0)
          .reduce((max, n) => Math.max(max, n), 0);

        if (maxSeq >= 99) throw new Error(`ID sequence full for ${prefix} (max 99/day)`);
        return `${prefix}-${String(maxSeq + 1).padStart(2, "0")}`;
      }

      function renderDayHeaders(weekStart) {
        document.getElementById("week-label").textContent =
          fmtWeekLabel(weekStart);
        dayHeadEls.forEach((el, index) => {
          const date = addDays(weekStart, index);
          el.textContent = `${DAY_NAMES[index]} ${date.getDate()}`;
          el.classList.toggle(
            "rux-scheduler__day-head--today",
            isoDate(date) === todayIso,
          );
        });
      }

      function rangesOverlap(a, b) {
        const aEnd = a.start + a.span - 1;
        const bEnd = b.start + b.span - 1;
        return a.start <= bEnd && b.start <= aEnd;
      }

      function assignLanes(placements) {
        const tracks = new Map();

        [...placements]
          .sort(
            (a, b) =>
              a.trackId.localeCompare(b.trackId) ||
              a.lane - b.lane ||
              a.start - b.start,
          )
          .forEach((placement) => {
            const lanes = tracks.get(placement.trackId) || [];
            let lane = 0;
            while (
              lanes[lane]?.some((entry) => rangesOverlap(entry, placement))
            ) {
              lane += 1;
            }

            placement.lane = lane;
            lanes[lane] = [...(lanes[lane] || []), placement];
            tracks.set(placement.trackId, lanes);
          });

        return placements;
      }

      function getWeekPlacements(weekStart, tripMap) {
        const weekEnd = addDays(weekStart, 6);
        const placements = [];

        Object.entries(tripTrackMap).forEach(([key, info]) => {
          const trip = tripMap[key];
          if (!trip?.startDate) return;

          const tripStart = parseIsoDate(trip.startDate);
          const tripEnd = parseIsoDate(trip.endDate || trip.startDate);
          if (tripEnd < weekStart || tripStart > weekEnd) return;

          const visibleStart = tripStart < weekStart ? weekStart : tripStart;
          const visibleEnd = tripEnd > weekEnd ? weekEnd : tripEnd;
          const start = Math.round((visibleStart - weekStart) / 864e5) + 1;
          const span = Math.round((visibleEnd - visibleStart) / 864e5) + 1;
          const fromPrev = tripStart < weekStart;
          const toNext = tripEnd > weekEnd;

          placements.push({
            trip: { ...trip, fromPrev, toNext },
            trackId: info.trackId,
            lane: info.lane,
            start,
            span,
            fromPrev,
            toNext,
          });
        });

        return assignLanes(placements);
      }

      function buildTrackGrid(track) {
        if (track.querySelector(".rux-scheduler__track-grid")) return;
        const grid = document.createElement("div");
        grid.className = "rux-scheduler__track-grid";
        grid.setAttribute("aria-hidden", "true");
        const days = schedulerDayCount(track);

        for (let day = 0; day < days; day += 1) {
          const cell = document.createElement("span");
          cell.className = "rux-scheduler__track-day";
          grid.appendChild(cell);
        }

        track.appendChild(grid);
      }

      document
        .querySelectorAll(".rux-scheduler__track")
        .forEach((track) => buildTrackGrid(track));

      function tokenPx(name) {
        const rootSize = Number.parseFloat(getComputedStyle(root).fontSize);
        const value = getComputedStyle(root).getPropertyValue(name).trim();
        if (value.endsWith("rem")) return Number.parseFloat(value) * rootSize;
        if (value.endsWith("px")) return Number.parseFloat(value);
        return Number.parseFloat(value) || 0;
      }

      function schedulerDayCount(track) {
        const scheduler = track.closest(".rux-scheduler");
        return (
          Number.parseFloat(
            getComputedStyle(scheduler).getPropertyValue(
              "--rux-scheduler-days",
            ),
          ) || 7
        );
      }

      function placeInline(bar, placement) {
        const days = schedulerDayCount(bar.parentElement);
        const dayPct = 100 / days;
        const startPct = (placement.start - 1) * dayPct;
        const spanPct = placement.span * dayPct;
        const fromPrev = placement.fromPrev || placement.trip.fromPrev;
        const toNext = placement.toNext || placement.trip.toNext;

        bar.style.left = "";
        bar.style.right = "";
        bar.style.width = "";

        if (fromPrev && toNext) {
          bar.style.left = "var(--rux-space-2)";
          bar.style.right = "var(--rux-space-2)";
          bar.style.width = "auto";
          return;
        }

        if (fromPrev) {
          bar.style.left = "var(--rux-space-2)";
          bar.style.width = `calc(${spanPct}% - var(--rux-space-4))`;
          return;
        }

        bar.style.left = `calc(${startPct}% + var(--rux-space-2))`;
        if (toNext) {
          bar.style.right = "var(--rux-space-2)";
          bar.style.width = "auto";
        } else {
          bar.style.width = `calc(${spanPct}% - var(--rux-space-4))`;
        }
      }

      function layoutTrack(track) {
        const entries = activePlacements
          .filter((placement) => placement.trackId === track.id)
          .sort((a, b) => a.lane - b.lane || a.start - b.start);
        const row = track.closest(".rux-scheduler__row");
        if (!entries.length) {
          row.style.removeProperty("--_row-height");
          return;
        }

        const inset = tokenPx("--rux-space-2");
        const gap = tokenPx("--rux-space-2");
        const days = schedulerDayCount(track);
        const dayInlineSize = track.clientWidth / days - inset * 2;
        const lanes = [...new Set(entries.map((entry) => entry.lane))].sort(
          (a, b) => a - b,
        );
        let y = inset;

        lanes.forEach((lane, index) => {
          const laneEntries = entries.filter((entry) => entry.lane === lane);
          laneEntries.forEach((entry) => {
            entry.bar.style.setProperty(
              "--rux-trip-bar-day-inline-size",
              `${dayInlineSize}px`,
            );
            placeInline(entry.bar, entry);
            entry.bar.style.top = `${y}px`;
          });
          const laneHeight = Math.max(
            ...laneEntries.map((entry) => entry.bar.offsetHeight),
          );
          y += laneHeight;
          if (index < lanes.length - 1) y += gap;
        });

        row.style.setProperty("--_row-height", `${y + inset}px`);
      }

      let activePlacements = [];
      let activeObservers = [];
      let currentWeekStart = startOfWeek(new Date());
      let layoutFrame = 0;

      function layoutScheduler() {
        cancelAnimationFrame(layoutFrame);
        layoutFrame = requestAnimationFrame(() => {
          document
            .querySelectorAll(".rux-scheduler__track")
            .forEach((track) => layoutTrack(track));
        });
      }

      function renderScheduler() {
        activeObservers.forEach((observer) => observer.disconnect());
        activeObservers = [];

        document
          .querySelectorAll(".rux-scheduler__track .rux-trip-bar")
          .forEach((bar) => bar.remove());

        activePlacements = getWeekPlacements(currentWeekStart, trips);
        activePlacements.forEach((placement) => {
          const bar = createTripBar(placement.trip, callbacks);
          placement.bar = bar;
          document.getElementById(placement.trackId).appendChild(bar);
        });

        renderDayHeaders(currentWeekStart);
        activePlacements.forEach((placement) => {
          const observer = new ResizeObserver(layoutScheduler);
          observer.observe(placement.bar);
          activeObservers.push(observer);
        });
        layoutScheduler();
      }

      window.addEventListener("resize", layoutScheduler);

      document.getElementById("prev-week").addEventListener("click", () => {
        currentWeekStart = addDays(currentWeekStart, -7);
        renderScheduler();
      });

      document.getElementById("next-week").addEventListener("click", () => {
        currentWeekStart = addDays(currentWeekStart, 7);
        renderScheduler();
      });

      document.getElementById("today-btn").addEventListener("click", () => {
        currentWeekStart = startOfWeek(new Date());
        renderScheduler();
      });

      renderScheduler();

      window.schedulerDemo = {
        trips,
        TRIP_REQUIREMENTS,
        get placements() { return activePlacements; },
        get weekStart()  { return currentWeekStart; },
        layoutScheduler,
        renderScheduler,
        generateTripId,
        computeBusLabel,
      };
    </script>
  </body>
</html>
