<!-- ════════════════════════════════════════════════════════════════
     MODULE: FLEET
     Reference component — the live version is embedded in index.html
     ════════════════════════════════════════════════════════════════ -->
<div class="scheduler-app__module" data-module="fleet" hidden>

  <!-- Fleet panel drawer -->
  <div class="scheduler-app__drawer" id="fleet-panel-drawer">
    <aside class="rux-fleet-panel" role="dialog" aria-labelledby="fp-title">
      <header class="rux-fleet-panel__header">
        <div class="rux-fleet-panel__heading">
          <h2 class="rux-fleet-panel__title" id="fp-title">Vehicle</h2>
          <span class="rux-fleet-panel__id" id="fp-fleet-id"></span>
        </div>
        <button class="rux-button rux-button--ghost rux-button--icon" id="fp-btn-close" type="button" aria-label="Close panel">
          <i data-lucide="x" class="rux-icon"></i>
        </button>
      </header>
      <nav class="rux-fleet-panel__tabs" aria-label="Vehicle editor sections">
        <div class="rux-segmented rux-segmented--ghost" data-fleet-tabs>
          <button class="rux-button" type="button" aria-selected="true"  aria-controls="pane-info"        title="Info"><i data-lucide="bus-front" class="rux-icon"></i><span class="rux-fleet-panel__tab-label">Info</span></button>
          <button class="rux-button" type="button" aria-selected="false" aria-controls="pane-service"     title="Service"><i data-lucide="wrench" class="rux-icon"></i><span class="rux-fleet-panel__tab-label">Service</span></button>
          <button class="rux-button" type="button" aria-selected="false" aria-controls="pane-fleet-trips" title="Trips"><i data-lucide="map" class="rux-icon"></i><span class="rux-fleet-panel__tab-label">Trips</span></button>
        </div>
      </nav>
      <div class="rux-fleet-panel__body">

        <!-- Info -->
        <div id="pane-info" class="rux-fleet-panel__pane" role="tabpanel">
          <div class="rux-fleet-panel__cols-2">
            <div class="rux-field"><label class="rux-field__label" for="fp-sort-order">Order</label><input class="rux-input" id="fp-sort-order" name="sortOrder" type="number" placeholder="1" min="1" /></div>
            <div class="rux-field"><label class="rux-field__label" for="fp-number">Unit number</label><input class="rux-input" id="fp-number" name="number" type="text" placeholder="e.g. 42" /></div>
          </div>
          <div class="rux-fleet-panel__cols-2">
            <div class="rux-field"><label class="rux-field__label" for="fp-make">Make</label><input class="rux-input" id="fp-make" name="make" type="text" placeholder="e.g. Prevost" /></div>
            <div class="rux-field"><label class="rux-field__label" for="fp-model">Model</label><input class="rux-input" id="fp-model" name="model" type="text" placeholder="e.g. H3-45" /></div>
          </div>
          <div class="rux-fleet-panel__cols-2">
            <div class="rux-field"><label class="rux-field__label" for="fp-year">Year</label><input class="rux-input" id="fp-year" name="year" type="number" placeholder="2024" min="1970" max="2099" /></div>
            <div class="rux-field"><label class="rux-field__label" for="fp-color">Color</label><input class="rux-input" id="fp-color" name="color" type="text" placeholder="e.g. White" /></div>
          </div>
          <div class="rux-field"><label class="rux-field__label" for="fp-vin">VIN</label><input class="rux-input" id="fp-vin" name="vin" type="text" placeholder="Vehicle identification number" maxlength="17" /></div>
          <div class="rux-fleet-panel__cols-2">
            <div class="rux-field"><label class="rux-field__label" for="fp-capacity">Capacity</label><input class="rux-input" id="fp-capacity" name="capacity" type="number" placeholder="55" min="1" /></div>
            <div class="rux-field">
              <label class="rux-field__label">Equipment</label>
              <div class="rux-fleet-panel__equipment">
                <button class="rux-button rux-button--toggle" id="fp-ada-lift" type="button" aria-pressed="false" data-rux-toggle-button>
                  <i data-lucide="accessibility" class="rux-icon"></i> ADA lift
                </button>
                <button class="rux-button rux-button--toggle" id="fp-sleeper" type="button" aria-pressed="false" data-rux-toggle-button>
                  <i data-lucide="bed" class="rux-icon"></i> Sleeper
                </button>
              </div>
            </div>
          </div>
          <div class="rux-field">
            <label class="rux-field__label">Type</label>
            <div class="rux-segmented" id="fp-type-group" data-rux-toggle-group>
              <button class="rux-button is-active" type="button" aria-pressed="true"  data-value="Motorcoach">Motorcoach</button>
              <button class="rux-button"            type="button" aria-pressed="false" data-value="Sprinter">Sprinter</button>
            </div>
          </div>
          <div class="rux-field">
            <label class="rux-field__label">Status</label>
            <div class="rux-segmented" id="fp-status-group" data-rux-toggle-group>
              <button class="rux-button is-active" type="button" aria-pressed="true"  data-value="active"      title="Active"><i data-lucide="circle-check" class="rux-icon"></i><span>Active</span></button>
              <button class="rux-button"            type="button" aria-pressed="false" data-value="maintenance" title="Maintenance"><i data-lucide="wrench" class="rux-icon"></i><span>Maintenance</span></button>
              <button class="rux-button"            type="button" aria-pressed="false" data-value="retired"     title="Retired"><i data-lucide="circle-x" class="rux-icon"></i><span>Retired</span></button>
            </div>
          </div>
        </div>

        <!-- Service -->
        <div id="pane-service" class="rux-fleet-panel__pane" role="tabpanel" hidden>
          <div class="rux-field"><label class="rux-field__label" for="fp-mileage">Odometer (mi)</label><input class="rux-input" id="fp-mileage" name="mileage" type="number" placeholder="0" min="0" /></div>
          <div class="rux-fleet-panel__cols-2">
            <div class="rux-field"><label class="rux-field__label" for="fp-last-service">Last service</label><input class="rux-input" id="fp-last-service" name="lastService" type="date" /></div>
            <div class="rux-field"><label class="rux-field__label" for="fp-next-service">Next service</label><input class="rux-input" id="fp-next-service" name="nextService" type="date" /></div>
          </div>
          <p class="rux-fleet-panel__section-label">Compliance</p>
          <div class="rux-fleet-panel__cols-2">
            <div class="rux-field"><label class="rux-field__label" for="fp-insurance-exp">Insurance exp.</label><input class="rux-input" id="fp-insurance-exp" name="insuranceExp" type="date" /></div>
            <div class="rux-field"><label class="rux-field__label" for="fp-registration-exp">Registration exp.</label><input class="rux-input" id="fp-registration-exp" name="registrationExp" type="date" /></div>
          </div>
          <div class="rux-field"><label class="rux-field__label" for="fp-inspection-exp">DOT inspection exp.</label><input class="rux-input" id="fp-inspection-exp" name="inspectionExp" type="date" /></div>
          <div class="rux-field"><label class="rux-field__label" for="fp-notes">Notes</label><textarea class="rux-textarea" id="fp-notes" name="notes" rows="4" placeholder="Internal notes about this vehicle…"></textarea></div>
        </div>

        <!-- Trips -->
        <div id="pane-fleet-trips" class="rux-fleet-panel__pane" role="tabpanel" hidden>
          <p class="rux-fleet-panel__section-label">Assigned trips</p>
          <ul class="rux-fleet-panel__trip-list" id="fp-trip-list"></ul>
        </div>

      </div>
      <footer class="rux-fleet-panel__footer">
        <button class="rux-button rux-button--danger"    id="fp-btn-delete" type="button"><i data-lucide="trash-2" class="rux-icon"></i><span class="rux-btn-label"> Delete</span></button>
        <button class="rux-button rux-button--secondary" id="fp-btn-clear"  type="button"><i data-lucide="eraser" class="rux-icon"></i><span class="rux-btn-label"> Clear</span></button>
        <button class="rux-button rux-button--primary"   id="fp-btn-save"   type="button"><i data-lucide="save" class="rux-icon"></i><span class="rux-btn-label"> Save</span></button>
      </footer>
    </aside>
    <div class="scheduler-app__drawer-handle" aria-hidden="true"></div>
  </div>
  <!-- /fleet-panel-drawer -->

  <section class="fleet-app__main" aria-label="Fleet roster">
    <header class="scheduler-app__bar">
      <button
        class="rux-button rux-button--ghost rux-button--icon scheduler-app__view-menu"
        type="button"
        id="fleet-menu-btn"
        aria-label="Open fleet panel"
      >
        <i data-lucide="menu" class="rux-icon"></i>
      </button>
      <div class="scheduler-app__brand">
        <h1 class="scheduler-app__title">Fleet</h1>
      </div>
      <div class="scheduler-app__toolbar">
        <input class="rux-input fleet-app__search" id="fleet-search" type="search" placeholder="Search…" aria-label="Search fleet" />
        <div class="rux-segmented" data-fleet-filter>
          <button class="rux-button is-active" type="button" aria-pressed="true"  data-filter="all">All</button>
          <button class="rux-button"            type="button" aria-pressed="false" data-filter="active">Active</button>
          <button class="rux-button"            type="button" aria-pressed="false" data-filter="maintenance">Maintenance</button>
          <button class="rux-button"            type="button" aria-pressed="false" data-filter="retired">Retired</button>
        </div>
        <button class="rux-button rux-button--primary" id="fp-btn-add" type="button">
          <i data-lucide="plus" class="rux-icon"></i> Add vehicle
        </button>
      </div>
    </header>
    <div class="fleet-app__table-wrap">
      <table class="rux-table fleet-app__table" aria-label="Fleet roster">
        <thead>
          <tr>
            <th scope="col" class="col-order">#</th>
            <th scope="col">Vehicle</th>
            <th scope="col">Type</th>
            <th scope="col">Status</th>
            <th scope="col">Capacity</th>
            <th scope="col" class="col-service">Next service</th>
            <th scope="col">Next trip</th>
          </tr>
        </thead>
        <tbody id="fleet-roster-body">
        </tbody>
      </table>
    </div>
  </section>

</div>
<!-- /module:fleet -->
