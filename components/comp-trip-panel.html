<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rux UI — Trip panel</title>
		<link rel="stylesheet" href="../css/tokens.css" />
		<link rel="stylesheet" href="../css/colors_and_type.css" />
		<link rel="stylesheet" href="../css/components.css" />
		<script src="https://unpkg.com/lucide@latest" defer></script>
		<script src="../js/controls.js" defer></script>
		<script src="../js/trip-panel.js" defer></script>
		<style>
			/* ── Demo page (not part of component) ──────────────────────────── */
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				background: var(--rux-bg);
				display: grid;
				grid-template-columns: 1fr 440px;
			}
			.demo-bg {
				display: flex;
				align-items: center;
				justify-content: center;
				color: var(--rux-fg-subtle);
				font-size: var(--rux-text-sm);
				background-image: repeating-linear-gradient(
					0deg,
					transparent,
					transparent 59px,
					var(--rux-border-subtle) 59px,
					var(--rux-border-subtle) 60px
				);
			}
		</style>
	</head>
	<body>
		<!-- Simulated scheduler background -->
		<div class="demo-bg">scheduler grid</div>

		<!-- ── Trip panel ─────────────────────────────────────────────────── -->
		<aside class="rux-trip-panel" role="dialog" aria-labelledby="trip-panel-title">
			<!-- Header -->
			<header class="rux-trip-panel__header">
				<div class="rux-trip-panel__heading">
					<h2 class="rux-trip-panel__title" id="trip-panel-title">Trip editor</h2>
					<span class="rux-trip-panel__id">260607-01</span>
				</div>
				<button class="rux-button rux-button--ghost rux-button--icon" aria-label="Close panel">
					<i data-lucide="x" class="rux-icon"></i>
				</button>
			</header>

			<!-- Tab nav -->
			<nav class="rux-trip-panel__tabs" aria-label="Trip editor sections">
				<div class="rux-segmented rux-segmented--ghost" data-trip-tabs>
					<button class="rux-button" aria-selected="true" aria-controls="pane-trip">Trip</button>
					<button class="rux-button" aria-selected="false" aria-controls="pane-itinerary">Itinerary</button>
					<button class="rux-button" aria-selected="false" aria-controls="pane-billing">Billing</button>
					<button class="rux-button" aria-selected="false" aria-controls="pane-dispatch">Dispatch</button>
					<button class="rux-button" aria-selected="false" aria-controls="pane-docs">Docs</button>
				</div>
			</nav>

			<!-- Tab panes -->
			<div class="rux-trip-panel__body">
				<!-- ── Trip ─────────────────────────────────────────────────── -->
				<div id="pane-trip" class="rux-trip-panel__pane" role="tabpanel">
					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-start">Start date</label>
							<input class="rux-input" id="tp-start" name="startDate" type="date" value="2026-06-07" />
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-end">End date</label>
							<input class="rux-input" id="tp-end" name="endDate" type="date" value="2026-06-09" />
						</div>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-customer">Customer</label>
							<input
								class="rux-input"
								id="tp-customer"
								name="customer"
								type="text"
								value="Arlington ISD"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-destination">Destination</label>
							<input
								class="rux-input"
								id="tp-destination"
								name="destination"
								type="text"
								value="Paragon Casino"
							/>
						</div>
					</div>

					<div class="rux-trip-panel__cols-3">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-dep">Departure</label>
							<input class="rux-input" id="tp-dep" name="departureTime" type="time" value="06:30" />
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-spot">Spot</label>
							<input class="rux-input" id="tp-spot" name="spotTime" type="time" value="06:00" />
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-return">Return</label>
							<input class="rux-input" id="tp-return" name="returnTime" type="time" value="22:00" />
						</div>
					</div>

					<div class="rux-field">
						<label class="rux-field__label" for="tp-pickup">Pick-up address</label>
						<input
							class="rux-input"
							id="tp-pickup"
							name="pickupAddress"
							type="text"
							value="805 W Ridge Rd, San Juan TX"
						/>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-book-name">Name</label>
							<input
								class="rux-input"
								id="tp-book-name"
								name="bookingContact.name"
								type="text"
								value="Ashley Pearl"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-book-phone">Phone</label>
							<input
								class="rux-input"
								id="tp-book-phone"
								name="bookingContact.phone"
								type="tel"
								value="956-555-0123"
							/>
						</div>
					</div>
					<div class="rux-field">
						<label class="rux-field__label" for="tp-book-email">Email</label>
						<input
							class="rux-input"
							id="tp-book-email"
							name="bookingContact.email"
							type="email"
							placeholder="contact@example.com"
						/>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label">Trip type</label>
							<div class="rux-segmented" data-rux-toggle-group>
								<button class="rux-button is-active" aria-pressed="true">Round trip</button>
								<button class="rux-button" aria-pressed="false">One way</button>
							</div>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" id="tp-buses-label">Buses</label>
							<div class="rux-segmented" data-rux-stepper role="group" aria-labelledby="tp-buses-label">
								<button
									class="rux-button rux-button--icon"
									type="button"
									data-stepper-dec
									aria-label="Fewer buses"
									disabled
								>
									<i data-lucide="minus" class="rux-icon"></i>
								</button>
								<span class="rux-stepper__count" aria-live="polite">1</span>
								<button
									class="rux-button rux-button--icon"
									type="button"
									data-stepper-inc
									aria-label="More buses"
								>
									<i data-lucide="plus" class="rux-icon"></i>
								</button>
								<input type="hidden" id="tp-buses" name="busesNeeded" value="1" min="1" max="20" />
							</div>
						</div>
					</div>
				</div>
				<!-- /pane-trip -->

				<!-- ── Itinerary ────────────────────────────────────────────── -->
				<!-- Rendered by js/itinerary.js -->
				<div
					id="pane-itinerary"
					class="rux-trip-panel__pane rux-trip-panel__pane--flush"
					role="tabpanel"
					hidden
				>
					<div class="rux-itin" id="tp-itin">
						<div class="rux-itin__summary" id="tp-itin-summary"></div>

						<div class="rux-itin__stops" id="tp-itin-stops"></div>

						<div class="rux-itin__actions">
							<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-add-pickup"
							>
								Pick-up
							</button>
							<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-add-stop"
							>
								Stop
							</button>
							<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-add-sleeper"
							>
								Sleeper
							</button>
							<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-add-day"
							>
								End day
							</button>
							<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-add-return"
							>
								Return
							</button>
						</div>
					</div>
				</div>
				<!-- /pane-itinerary -->

				<!-- ── Billing ─────────────────────────────────────────────────── -->
				<div id="pane-billing" class="rux-trip-panel__pane" role="tabpanel" hidden>
					<div class="rux-field">
						<label class="rux-field__label">Contract</label>
						<div class="rux-segmented" data-rux-toggle-group>
							<button class="rux-button is-active" aria-pressed="true">Pending</button>
							<button class="rux-button" aria-pressed="false">N/A</button>
							<button class="rux-button" aria-pressed="false">Signed</button>
							<button class="rux-button" aria-pressed="false">PO</button>
						</div>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-price">Quoted price</label>
							<div class="rux-input-group rux-input-group--prefix">
								<span class="rux-input-group__prefix">$</span>
								<input
									class="rux-input"
									id="tp-price"
									name="quotedPrice"
									type="number"
									min="0"
									step="0.01"
									value="1200"
								/>
							</div>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-est-mi">Est. miles</label>
							<div class="rux-input-group rux-input-group--suffix">
								<input
									class="rux-input"
									id="tp-est-mi"
									name="estimatedMiles"
									type="number"
									min="0"
									value="160"
								/>
								<span class="rux-input-group__suffix">mi</span>
							</div>
						</div>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-drive-hr">Driving hours</label>
							<div class="rux-input-group rux-input-group--suffix">
								<input
									class="rux-input"
									id="tp-drive-hr"
									name="estimatedDrivingHours"
									type="number"
									min="0"
									step="0.5"
									placeholder="0.0"
								/>
								<span class="rux-input-group__suffix">hr</span>
							</div>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-duty-hr">On-duty hours</label>
							<div class="rux-input-group rux-input-group--suffix">
								<input
									class="rux-input"
									id="tp-duty-hr"
									name="estimatedOnDutyHours"
									type="number"
									min="0"
									step="0.5"
									placeholder="0.0"
								/>
								<span class="rux-input-group__suffix">hr</span>
							</div>
						</div>
					</div>

					<div class="rux-field">
						<label class="rux-field__label">Invoice</label>
						<div class="rux-segmented" data-rux-toggle-group>
							<button class="rux-button is-active" aria-pressed="true">Pending</button>
							<button class="rux-button" aria-pressed="false">Invoiced</button>
							<button class="rux-button" aria-pressed="false">Deposit</button>
							<button class="rux-button" aria-pressed="false">Paid</button>
						</div>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-po">PO / ref</label>
							<input class="rux-input" id="tp-po" name="paymentRef" type="text" value="PO-1842" />
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-inv-num">Invoice number</label>
							<input
								class="rux-input"
								id="tp-inv-num"
								name="invoiceNumber"
								type="text"
								value="INV-260509"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-date-paid">Date paid</label>
							<input class="rux-input" id="tp-date-paid" name="datePaid" type="date" />
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-act-mi">Actual miles</label>
							<div class="rux-input-group rux-input-group--suffix">
								<input
									class="rux-input"
									id="tp-act-mi"
									name="actualMiles"
									type="number"
									min="0"
									value="158"
								/>
								<span class="rux-input-group__suffix">mi</span>
							</div>
						</div>
					</div>

					<div class="rux-field">
						<label class="rux-field__label">Payment refs</label>
						<div class="rux-trip-panel__refs">
							<input
								class="rux-input"
								name="paymentRef1"
								type="text"
								placeholder="Ref 1"
								value="ck# 1107"
							/>
							<input class="rux-input" name="paymentRef2" type="text" placeholder="Ref 2" />
							<input class="rux-input" name="paymentRef3" type="text" placeholder="Ref 3" />
						</div>
					</div>
				</div>
				<!-- /pane-billing -->

				<!-- ── Dispatch ────────────────────────────────────────────────── -->
				<div id="pane-dispatch" class="rux-trip-panel__pane" role="tabpanel" hidden>
					<p class="rux-trip-panel__section-label">Vehicle requirements</p>
					<div class="rux-trip-panel__reqs" id="tp-vehicle-reqs"></div>

					<p class="rux-trip-panel__section-label">Driver needs</p>
					<div class="rux-cluster" id="tp-driver-needs"></div>

					<!-- Bus groups — rendered by trip-panel.js from #tp-buses count -->
					<div class="rux-trip-panel__bus-groups" id="tp-bus-groups"></div>
				</div>
				<!-- /pane-dispatch -->

				<!-- ── Docs ────────────────────────────────────────────────────── -->
				<div id="pane-docs" class="rux-trip-panel__pane" role="tabpanel" hidden>
					<div class="rux-trip-panel__doc-upload">
						<button class="rux-button" id="tp-doc-upload-btn" type="button">
							<i data-lucide="upload" class="rux-icon"></i> Upload
						</button>
						<input type="file" id="tp-doc-file-input" hidden accept="*/*" />
						<div class="rux-trip-panel__doc-label-pick" id="tp-doc-label-pick" hidden>
							<select class="rux-select" id="tp-doc-label-select">
								<option value="" disabled selected>Label…</option>
								<option value="Quote">Quote</option>
								<option value="PO">PO</option>
								<option value="Itinerary">Itinerary</option>
								<option value="Contract">Contract</option>
								<option value="Permit">Permit</option>
								<option value="Other">Other</option>
							</select>
							<button class="rux-button rux-button--primary" id="tp-doc-add-btn" type="button">
								Add
							</button>
							<button class="rux-button rux-button--ghost" id="tp-doc-cancel-btn" type="button">
								Cancel
							</button>
						</div>
					</div>

					<ul class="rux-trip-panel__doc-list" id="tp-doc-list">
						<li class="rux-trip-panel__doc-row">
							<span class="rux-trip-panel__doc-chip">Contract</span>
							<span class="rux-trip-panel__doc-name">Arlington_ISD_contract.pdf</span>
							<button class="rux-button rux-button--ghost rux-button--sm" type="button">Open</button>
							<button
								class="rux-button rux-button--ghost rux-button--sm rux-button--icon"
								type="button"
								aria-label="Delete"
							>
								<i data-lucide="trash-2" class="rux-icon"></i>
							</button>
						</li>
						<li class="rux-trip-panel__doc-row">
							<span class="rux-trip-panel__doc-chip">Quote</span>
							<span class="rux-trip-panel__doc-name">quote_260607.pdf</span>
							<button class="rux-button rux-button--ghost rux-button--sm" type="button">Open</button>
							<button
								class="rux-button rux-button--ghost rux-button--sm rux-button--icon"
								type="button"
								aria-label="Delete"
							>
								<i data-lucide="trash-2" class="rux-icon"></i>
							</button>
						</li>
						<li class="rux-trip-panel__doc-row">
							<span class="rux-trip-panel__doc-chip">PO</span>
							<span class="rux-trip-panel__doc-name">PO-1842.pdf</span>
							<button class="rux-button rux-button--ghost rux-button--sm" type="button">Open</button>
							<button
								class="rux-button rux-button--ghost rux-button--sm rux-button--icon"
								type="button"
								aria-label="Delete"
							>
								<i data-lucide="trash-2" class="rux-icon"></i>
							</button>
						</li>
					</ul>

					<div class="rux-field">
						<label class="rux-field__label" for="tp-notes">Notes</label>
						<input
							class="rux-input"
							id="tp-notes"
							name="notes"
							type="text"
							placeholder="Operational notes shown on trip bar…"
						/>
					</div>

					<p class="rux-trip-panel__section-label">Trip contacts</p>
					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-trip-name">Name</label>
							<input
								class="rux-input"
								id="tp-trip-name"
								name="tripContact.name"
								type="text"
								placeholder="On-site contact"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-trip-phone">Phone</label>
							<input class="rux-input" id="tp-trip-phone" name="tripContact.phone" type="tel" />
						</div>
					</div>
					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-trip2-name">Name</label>
							<input
								class="rux-input"
								id="tp-trip2-name"
								name="tripContact2.name"
								type="text"
								placeholder="Secondary contact"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-trip2-phone">Phone</label>
							<input class="rux-input" id="tp-trip2-phone" name="tripContact2.phone" type="tel" />
						</div>
					</div>
				</div>
				<!-- /pane-docs -->
			</div>
			<!-- /.trip-panel__body -->

			<!-- Footer -->
			<footer class="rux-trip-panel__footer">
				<button class="rux-button rux-button--danger">
					<i data-lucide="trash-2" class="rux-icon"></i> Delete
				</button>
				<button class="rux-button rux-button--secondary">Clear</button>
				<button class="rux-button rux-button--primary"><i data-lucide="save" class="rux-icon"></i> Save</button>
			</footer>
		</aside>
		<!-- /.trip-panel -->

		<script src="../js/utilities.js"></script>
		<script src="../js/itinerary.js"></script>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				if (window.lucide) lucide.createIcons();
				const panel = document.querySelector(".rux-trip-panel");
				TripPanel.init(panel);
				Itinerary.init(panel);
			});
		</script>
	</body>
</html>
