<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rux UI — Trip panel</title>
		<link rel="stylesheet" href="../css/tokens.css" />
		<link rel="stylesheet" href="../css/colors_and_type.css" />
		<link rel="stylesheet" href="../css/components.css" />
		<script src="https://unpkg.com/lucide@latest" defer></script>
		<script src="../js/controls.js" defer></script>
		<script src="../js/trip-panel.js" defer></script>
		<style>
			/* ── Demo page (not part of component) ──────────────────────────── */
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				background: var(--rux-bg);
				display: grid;
				grid-template-columns: 1fr 440px;
			}
			.demo-bg {
				display: flex;
				align-items: center;
				justify-content: center;
				color: var(--rux-fg-subtle);
				font-size: var(--rux-text-sm);
				background-image: repeating-linear-gradient(
					0deg,
					transparent,
					transparent 59px,
					var(--rux-border-subtle) 59px,
					var(--rux-border-subtle) 60px
				);
			}
		</style>
	</head>
	<body>
		<!-- Simulated scheduler background -->
		<div class="demo-bg">scheduler grid</div>

		<!-- ── Trip panel ─────────────────────────────────────────────────── -->
		<aside class="rux-trip-panel" role="dialog" aria-labelledby="trip-panel-title">
			<!-- Header -->
			<header class="rux-trip-panel__header">
				<div class="rux-trip-panel__heading">
					<h2 class="rux-trip-panel__title" id="trip-panel-title">Trip editor</h2>
					<span class="rux-trip-panel__id">260607-01</span>
				</div>
				<button class="rux-button rux-button--ghost rux-button--icon" id="tp-import-btn" type="button" title="Import from JSON">
					<i data-lucide="upload" class="rux-icon"></i>
				</button>
				<button class="rux-button rux-button--ghost rux-button--icon" aria-label="Close panel">
					<i data-lucide="x" class="rux-icon"></i>
				</button>
			</header>

			<!-- Tab nav -->
			<nav class="rux-trip-panel__tabs" aria-label="Trip editor sections">
				<div class="rux-segmented rux-segmented--ghost" data-trip-tabs>
					<button class="rux-button" aria-selected="true" aria-controls="pane-trip" aria-label="Info" title="Info"><i data-lucide="info" class="rux-icon"></i><span class="rux-trip-panel__tab-label">Info</span></button>
					<button class="rux-button" aria-selected="false" aria-controls="pane-billing" aria-label="Bill" title="Bill"><i data-lucide="receipt" class="rux-icon"></i><span class="rux-trip-panel__tab-label">Bill</span></button>
					<button class="rux-button" aria-selected="false" aria-controls="pane-itinerary" aria-label="Route" title="Route"><span class="rux-icon rux-trip-panel__route-icon" aria-hidden="true"></span><span class="rux-trip-panel__tab-label">Route</span></button>
					<button class="rux-button" aria-selected="false" aria-controls="pane-dispatch" aria-label="Fleet" title="Fleet"><span class="rux-icon rux-trip-panel__fleet-icon" aria-hidden="true"></span><span class="rux-trip-panel__tab-label">Fleet</span></button>
					<button class="rux-button" aria-selected="false" aria-controls="pane-docs" aria-label="Docs" title="Docs"><i data-lucide="files" class="rux-icon"></i><span class="rux-trip-panel__tab-label">Docs</span></button>
				</div>
			</nav>

			<!-- Tab panes -->
			<div class="rux-trip-panel__body">
				<!-- ── Trip ─────────────────────────────────────────────────── -->
				<div id="pane-trip" class="rux-trip-panel__pane" role="tabpanel">
					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-customer">Customer</label>
							<input
								class="rux-input"
								id="tp-customer"
								name="customer"
								type="text"
								placeholder="Customer name"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-destination">Destination</label>
							<input
								class="rux-input"
								id="tp-destination"
								name="destination"
								type="text"
								placeholder="Destination"
							/>
						</div>
					</div>

					<div class="rux-trip-panel__logistics-grid">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-start">Start date</label>
							<input class="rux-input" id="tp-start" name="startDate" type="date" />
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-end">End date</label>
							<input class="rux-input" id="tp-end" name="endDate" type="date" />
						</div>
					</div>


					<div class="rux-field">
						<label class="rux-field__label" for="tp-pickup">Pick-up address</label>
						<input
							class="rux-input"
							id="tp-pickup"
							name="pickupAddress"
							type="text"
							placeholder="Street address"
						/>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-book-name">Name</label>
							<input
								class="rux-input"
								id="tp-book-name"
								name="bookingContact.name"
								type="text"
								placeholder="Contact name"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-book-phone">Phone</label>
							<input
								class="rux-input"
								id="tp-book-phone"
								name="bookingContact.phone"
								type="tel"
								placeholder="Phone number"
							/>
						</div>
					</div>
					<div class="rux-field">
						<label class="rux-field__label" for="tp-book-email">Email</label>
						<input
							class="rux-input"
							id="tp-book-email"
							name="bookingContact.email"
							type="email"
							placeholder="contact@example.com"
						/>
					</div>
					<p class="rux-trip-panel__section-label">Trip options</p>
					<div class="rux-cluster">
						<button class="rux-button rux-button--toggle" id="tp-one-way" type="button" aria-pressed="false" data-rux-toggle-button title="One way trip">One way</button>
					</div>
					<p class="rux-trip-panel__section-label">Vehicle requirements</p>
					<div class="rux-trip-panel__reqs" id="tp-vehicle-reqs"></div>
					<p class="rux-trip-panel__section-label">Driver needs</p>
					<div class="rux-cluster" id="tp-driver-needs"></div>
				</div>
				<!-- /pane-trip -->

				<!-- ── Itinerary ────────────────────────────────────────────── -->
				<!-- Rendered by js/itinerary.js -->
				<div
					id="pane-itinerary"
					class="rux-trip-panel__pane rux-trip-panel__pane--flush"
					role="tabpanel"
					hidden
				>
					<div class="rux-itin" id="tp-itin">
						<div class="rux-itin__summary" id="tp-itin-summary"></div>

						<div class="rux-itin__stops" id="tp-itin-stops"></div>

						<div class="rux-itin__actions">
							<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-add-stop"
								title="Add stop"
							>
								<i data-lucide="map-pin" class="rux-icon"></i>
								<span class="rux-btn-label">Stop</span>
							</button>
							<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-add-sleeper"
								title="Add sleep"
							>
								<i data-lucide="bed" class="rux-icon"></i>
								<span class="rux-btn-label">Sleep</span>
							</button>
							<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-add-day"
								title="End day"
							>
								<i data-lucide="calendar-x" class="rux-icon"></i>
								<span class="rux-btn-label">End</span>
							</button>
<button
								class="rux-button rux-button--secondary"
								type="button"
								id="tp-itin-recalc"
								title="Recalculate route"
							>
								<i data-lucide="route" class="rux-icon"></i>
								<span class="rux-btn-label">Route</span>
							</button>
							<button class="rux-button rux-button--ghost rux-button--icon" type="button" id="tp-itin-reorder" title="Reorder stops">
								<i data-lucide="arrow-up-down" class="rux-icon"></i>
							</button>
						</div>
					</div>
				</div>
				<!-- /pane-itinerary -->

				<!-- ── Billing ─────────────────────────────────────────────────── -->
				<div id="pane-billing" class="rux-trip-panel__pane" role="tabpanel" hidden>
					<div class="rux-field">
						<label class="rux-field__label">Contract</label>
						<div class="rux-segmented rux-trip-panel__status-group" id="tp-contract-group" data-rux-toggle-group>
							<button class="rux-button is-active" aria-pressed="true" aria-label="Pending" title="Pending"><i data-lucide="clock" class="rux-icon"></i><span class="rux-trip-panel__status-label">Pending</span></button>
							<button class="rux-button" aria-pressed="false" aria-label="N/A" title="N/A"><i data-lucide="ban" class="rux-icon"></i><span class="rux-trip-panel__status-label">N/A</span></button>
							<button class="rux-button" aria-pressed="false" aria-label="Signed" title="Signed"><span class="rux-icon rux-trip-panel__signed-icon" aria-hidden="true"></span><span class="rux-trip-panel__status-label">Signed</span></button>
							<button class="rux-button" aria-pressed="false" aria-label="PO" title="PO"><span class="rux-icon rux-trip-panel__po-icon" aria-hidden="true"></span><span class="rux-trip-panel__status-label">PO</span></button>
						</div>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-price">Quoted price</label>
							<div class="rux-input-group rux-input-group--prefix">
								<span class="rux-input-group__prefix">$</span>
								<input
									class="rux-input"
									id="tp-price"
									name="quotedPrice"
									type="number"
									min="0"
									step="0.01"
									placeholder="0.00"
								/>
							</div>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-est-mi">Est. miles</label>
							<div class="rux-input-group rux-input-group--suffix">
								<input
									class="rux-input"
									id="tp-est-mi"
									name="estimatedMiles"
									type="number"
									min="0"
								/>
								<span class="rux-input-group__suffix">mi</span>
							</div>
						</div>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-drive-hr">Driving hours</label>
							<div class="rux-input-group rux-input-group--suffix">
								<input
									class="rux-input"
									id="tp-drive-hr"
									name="estimatedDrivingHours"
									type="number"
									min="0"
									step="0.5"
									placeholder="0.0"
								/>
								<span class="rux-input-group__suffix">hr</span>
							</div>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-duty-hr">On-duty hours</label>
							<div class="rux-input-group rux-input-group--suffix">
								<input
									class="rux-input"
									id="tp-duty-hr"
									name="estimatedOnDutyHours"
									type="number"
									min="0"
									step="0.5"
									placeholder="0.0"
								/>
								<span class="rux-input-group__suffix">hr</span>
							</div>
						</div>
					</div>

					<div class="rux-field">
						<label class="rux-field__label">Invoice</label>
						<div class="rux-segmented rux-trip-panel__status-group" id="tp-invoice-group" data-rux-toggle-group>
							<button class="rux-button is-active" aria-pressed="true" aria-label="Pending" title="Pending"><i data-lucide="clock" class="rux-icon"></i><span class="rux-trip-panel__status-label">Pending</span></button>
							<button class="rux-button" aria-pressed="false" aria-label="Invoiced" title="Invoiced"><span class="rux-icon rux-trip-panel__invoiced-icon" aria-hidden="true"></span><span class="rux-trip-panel__status-label">Invoiced</span></button>
							<button class="rux-button" aria-pressed="false" aria-label="Deposit" title="Deposit"><span class="rux-icon rux-trip-panel__deposit-icon" aria-hidden="true"></span><span class="rux-trip-panel__status-label">Deposit</span></button>
							<button class="rux-button" aria-pressed="false" aria-label="Paid" title="Paid"><i data-lucide="circle-check" class="rux-icon"></i><span class="rux-trip-panel__status-label">Paid</span></button>
						</div>
					</div>

					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-po">PO / ref</label>
							<input class="rux-input" id="tp-po" name="paymentRef" type="text" placeholder="PO / ref" />
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-inv-num">Invoice number</label>
							<input
								class="rux-input"
								id="tp-inv-num"
								name="invoiceNumber"
								type="text"
								placeholder="INV-"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-date-paid">Date paid</label>
							<input class="rux-input" id="tp-date-paid" name="datePaid" type="date" />
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-act-mi">Actual miles</label>
							<div class="rux-input-group rux-input-group--suffix">
								<input
									class="rux-input"
									id="tp-act-mi"
									name="actualMiles"
									type="number"
									min="0"
								/>
								<span class="rux-input-group__suffix">mi</span>
							</div>
						</div>
					</div>

					<div class="rux-field">
						<label class="rux-field__label">Payment refs</label>
						<div class="rux-trip-panel__refs">
							<input class="rux-input" id="tp-pay-ref-1" name="paymentRef1" type="text" placeholder="Ref 1" />
							<input class="rux-input" id="tp-pay-ref-2" name="paymentRef2" type="text" placeholder="Ref 2" hidden />
							<input class="rux-input" id="tp-pay-ref-3" name="paymentRef3" type="text" placeholder="Ref 3" hidden />
						</div>
					</div>
				</div>
				<!-- /pane-billing -->

				<!-- ── Dispatch ────────────────────────────────────────────────── -->
				<div id="pane-dispatch" class="rux-trip-panel__pane" role="tabpanel" hidden>
					<div class="rux-trip-panel__fleet-count-card">
						<span class="rux-trip-panel__fleet-count-label" id="tp-buses-label">Buses Needed</span>
						<div class="rux-trip-panel__number-picker" role="group" aria-labelledby="tp-buses-label">
							<button class="rux-button rux-button--ghost rux-button--icon rux-button--sm rux-trip-panel__number-btn" type="button" data-bus-count-dec aria-label="Fewer buses"><i data-lucide="minus" class="rux-icon"></i></button>
							<input class="rux-input rux-trip-panel__number-input" id="tp-buses" name="busesNeeded" type="number" min="1" max="20" step="1" value="1" inputmode="numeric" aria-labelledby="tp-buses-label" />
							<button class="rux-button rux-button--ghost rux-button--icon rux-button--sm rux-trip-panel__number-btn" type="button" data-bus-count-inc aria-label="More buses"><i data-lucide="plus" class="rux-icon"></i></button>
						</div>
					</div>
					<!-- Bus groups — rendered by trip-panel.js from #tp-buses count -->
					<div class="rux-trip-panel__bus-groups" id="tp-bus-groups"></div>
				</div>
				<!-- /pane-dispatch -->

				<!-- ── Docs ────────────────────────────────────────────────────── -->
				<div id="pane-docs" class="rux-trip-panel__pane" role="tabpanel" hidden>
					<div class="rux-trip-panel__doc-upload">
						<button class="rux-button" id="tp-doc-upload-btn" type="button">
							<i data-lucide="upload" class="rux-icon"></i> Upload
						</button>
						<input type="file" id="tp-doc-file-input" hidden accept="*/*" />
						<div class="rux-trip-panel__doc-label-pick" id="tp-doc-label-pick" hidden>
							<select class="rux-select" id="tp-doc-label-select">
								<option value="" disabled selected>Label…</option>
								<option value="Quote">Quote</option>
								<option value="PO">PO</option>
								<option value="Itinerary">Itinerary</option>
								<option value="Contract">Contract</option>
								<option value="Permit">Permit</option>
								<option value="Other">Other</option>
							</select>
							<button class="rux-button rux-button--primary" id="tp-doc-add-btn" type="button">
								Add
							</button>
							<button class="rux-button rux-button--ghost" id="tp-doc-cancel-btn" type="button">
								Cancel
							</button>
						</div>
					</div>

					<ul class="rux-trip-panel__doc-list" id="tp-doc-list">
						<li class="rux-trip-panel__doc-row">
							<span class="rux-trip-panel__doc-chip">Contract</span>
							<span class="rux-trip-panel__doc-name">Arlington_ISD_contract.pdf</span>
							<button class="rux-button rux-button--ghost rux-button--sm" type="button">Open</button>
							<button
								class="rux-button rux-button--ghost rux-button--sm rux-button--icon"
								type="button"
								aria-label="Delete"
							>
								<i data-lucide="trash-2" class="rux-icon"></i>
							</button>
						</li>
						<li class="rux-trip-panel__doc-row">
							<span class="rux-trip-panel__doc-chip">Quote</span>
							<span class="rux-trip-panel__doc-name">quote_260607.pdf</span>
							<button class="rux-button rux-button--ghost rux-button--sm" type="button">Open</button>
							<button
								class="rux-button rux-button--ghost rux-button--sm rux-button--icon"
								type="button"
								aria-label="Delete"
							>
								<i data-lucide="trash-2" class="rux-icon"></i>
							</button>
						</li>
						<li class="rux-trip-panel__doc-row">
							<span class="rux-trip-panel__doc-chip">PO</span>
							<span class="rux-trip-panel__doc-name">PO-1842.pdf</span>
							<button class="rux-button rux-button--ghost rux-button--sm" type="button">Open</button>
							<button
								class="rux-button rux-button--ghost rux-button--sm rux-button--icon"
								type="button"
								aria-label="Delete"
							>
								<i data-lucide="trash-2" class="rux-icon"></i>
							</button>
						</li>
					</ul>

					<div class="rux-field">
						<label class="rux-field__label" for="tp-notes">Notes</label>
						<input
							class="rux-input"
							id="tp-notes"
							name="notes"
							type="text"
							placeholder="Operational notes shown on trip bar…"
						/>
					</div>

					<p class="rux-trip-panel__section-label">Trip contacts</p>
					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-trip-name">Name</label>
							<input
								class="rux-input"
								id="tp-trip-name"
								name="tripContact.name"
								type="text"
								placeholder="On-site contact"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-trip-phone">Phone</label>
							<input class="rux-input" id="tp-trip-phone" name="tripContact.phone" type="tel" />
						</div>
					</div>
					<div class="rux-trip-panel__cols-2">
						<div class="rux-field">
							<label class="rux-field__label" for="tp-trip2-name">Name</label>
							<input
								class="rux-input"
								id="tp-trip2-name"
								name="tripContact2.name"
								type="text"
								placeholder="Secondary contact"
							/>
						</div>
						<div class="rux-field">
							<label class="rux-field__label" for="tp-trip2-phone">Phone</label>
							<input class="rux-input" id="tp-trip2-phone" name="tripContact2.phone" type="tel" />
						</div>
					</div>
				</div>
				<!-- /pane-docs -->
			</div>
			<!-- /.trip-panel__body -->

			<!-- Footer -->
			<footer class="rux-trip-panel__footer">
				<button class="rux-button rux-button--danger" id="tp-btn-delete">
					<i data-lucide="trash-2" class="rux-icon"></i> Delete
				</button>
				<button class="rux-button rux-button--secondary" id="tp-btn-clear"><i data-lucide="eraser" class="rux-icon"></i> Clear</button>
				<button class="rux-button rux-button--primary" id="tp-btn-save"><i data-lucide="save" class="rux-icon"></i> Save</button>
			</footer>
		</aside>
		<!-- /.trip-panel -->

		<!-- Import trip modal -->
		<div class="rux-modal-backdrop" id="tp-import-modal" hidden>
			<div class="rux-modal" role="dialog" aria-modal="true" aria-labelledby="tp-import-modal-title" style="width: min(520px, calc(100vw - var(--rux-space-8)))">
				<div class="rux-modal__header">
					<div class="rux-modal__title" id="tp-import-modal-title">Import trip from JSON</div>
				</div>
				<div class="rux-modal__body">
					<div style="display:flex; flex-direction:column; gap:var(--rux-space-3)">
						<textarea id="tp-import-textarea" class="rux-input" rows="10"
							placeholder="Paste JSON here — or use the file button below…"
							style="font-family:var(--rux-font-mono); font-size:var(--rux-text-xs); resize:vertical; min-height:14rem; height:14rem"></textarea>
						<div style="display:flex; align-items:center; gap:var(--rux-space-2)">
							<label class="rux-button rux-button--ghost" style="cursor:pointer">
								<i data-lucide="file-up" class="rux-icon"></i>
								<span class="rux-btn-label">Upload .json</span>
								<input type="file" accept=".json,application/json" id="tp-import-file" hidden />
							</label>
							<span id="tp-import-error" style="color:var(--rux-danger); font-size:var(--rux-text-xs); flex:1"></span>
						</div>
					</div>
				</div>
				<div class="rux-modal__footer">
					<button class="rux-button rux-button--ghost" id="tp-import-cancel">Cancel</button>
					<button class="rux-button rux-button--primary" id="tp-import-confirm">Import</button>
				</div>
			</div>
		</div>

		<script src="../js/utilities.js"></script>
		<script src="../js/trip-panel.js"></script>
		<script src="../js/itinerary.js"></script>
		<script type="module">
			import { initTripDB, loadTrip } from "../js/trip-db.js";
			/* Module scripts are deferred — DOM and sync scripts are already ready */
			if (window.lucide) lucide.createIcons();
			const panel = document.querySelector(".rux-trip-panel");
			TripPanel.init(panel);
			const itinerary = Itinerary.init(panel);
			initTripDB(panel, itinerary);

			// Import modal
			const importModal    = document.getElementById("tp-import-modal");
			const importTextarea = document.getElementById("tp-import-textarea");
			const importError    = document.getElementById("tp-import-error");
			const importFile     = document.getElementById("tp-import-file");

			document.getElementById("tp-import-btn").addEventListener("click", () => {
				importTextarea.value = "";
				importError.textContent = "";
				importModal.hidden = false;
				importTextarea.focus();
			});

			document.getElementById("tp-import-cancel").addEventListener("click", () => {
				importModal.hidden = true;
			});

			importModal.addEventListener("click", (e) => {
				if (e.target === importModal) importModal.hidden = true;
			});

			importFile.addEventListener("change", () => {
				const file = importFile.files[0];
				if (!file) return;
				const reader = new FileReader();
				reader.onload = (ev) => { importTextarea.value = ev.target.result; };
				reader.readAsText(file);
				importFile.value = "";
			});

			document.getElementById("tp-import-confirm").addEventListener("click", () => {
				importError.textContent = "";
				let parsed;
				try {
					parsed = JSON.parse(importTextarea.value.trim());
				} catch {
					importError.textContent = "Invalid JSON — check the format and try again.";
					return;
				}
				if (!parsed || typeof parsed !== "object") {
					importError.textContent = "Expected a JSON object.";
					return;
				}
				if (!parsed.stops && parsed.trip_stops) parsed.stops = parsed.trip_stops;
				loadTrip(panel, itinerary, parsed);
				importModal.hidden = true;
			});
		</script>
	</body>
</html>
