<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rux Application Layout</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
		/>
		<link rel="stylesheet" href="../rux-ui/css/rux.css" />
		<style>
			/* Example-only sizing. Drawer and responsive behavior belong to the app. */
			.rux-app__body { position: relative; }
			.example-panel { flex: 0 0 18rem; min-width: 0; min-height: 0; }
			.example-navigation {
				position: absolute;
				inset-block: 0;
				inset-inline-start: 0;
				z-index: var(--rux-z-overlay);
				visibility: hidden;
				pointer-events: none;
				clip-path: inset(0 100% 0 0);
				opacity: 1;
				will-change: clip-path;
				transition:
					clip-path var(--rux-side-nav-motion-duration) var(--rux-side-nav-exit-easing),
					visibility 0s linear var(--rux-side-nav-motion-duration);
			}
			.example-navigation.is-open {
				visibility: visible;
				pointer-events: auto;
				clip-path: inset(0);
				transition:
					clip-path var(--rux-side-nav-motion-duration) var(--rux-side-nav-enter-easing),
					visibility 0s linear 0s;
			}
			.example-navigation-scrim {
				position: absolute;
				inset-block: 0;
				inset-inline-start: 0;
				inset-inline-end: 0;
				z-index: calc(var(--rux-z-overlay) - 1);
				visibility: hidden;
				pointer-events: none;
				background: var(--rux-side-nav-scrim-bg);
				opacity: 0;
				transition:
					opacity var(--rux-side-nav-scrim-exit-duration),
					inset-inline-start var(--rux-side-nav-scrim-exit-duration);
			}
			.example-navigation-scrim.is-visible {
				visibility: visible;
				pointer-events: auto;
				inset-inline-start: min(var(--rux-side-nav-width), 100%);
				opacity: var(--rux-side-nav-scrim-opacity);
				transition:
					inset-inline-start var(--rux-side-nav-motion-duration)
						var(--rux-side-nav-enter-easing),
					opacity var(--rux-side-nav-scrim-enter-duration)
						var(--rux-side-nav-scrim-enter-easing)
						var(--rux-side-nav-scrim-enter-delay);
			}
			.example-workspace-content > * + * { margin-top: var(--rux-space-4); }
			@media (max-width: 760px) {
				.rux-panel.example-panel { display: none; }
			}
			@media (prefers-reduced-motion: reduce) {
				.example-navigation,
				.example-navigation-scrim {
					transition-duration: 1ms;
					transition-delay: 0s;
				}
			}
		</style>
	</head>
	<body>
		<div class="rux-app">
			<header class="rux-ui-header">
				<button
					class="rux-button rux-button--ghost rux-button--icon rux-ui-header__button rux-ui-header__menu"
					type="button"
					aria-label="Open Navigation"
					aria-expanded="false"
					aria-controls="example-navigation"
					data-rux-side-nav-toggle
				>
					<span class="rux-ui-header__disclosure-icons" aria-hidden="true">
						<span
							class="rux-icon rux-ui-header__disclosure-icon rux-ui-header__disclosure-icon--default"
							>menu</span
						>
						<span
							class="rux-icon rux-ui-header__disclosure-icon rux-ui-header__disclosure-icon--close"
							>close</span
						>
					</span>
				</button>
				<div class="rux-ui-header__brand">
					<strong>Rux</strong>
				</div>
				<div class="rux-ui-header__actions">
					<div class="rux-ui-header__action-group">
						<button
							class="rux-button rux-button--ghost rux-button--icon"
							type="button"
							aria-label="Search"
							title="Search"
						>
							<span class="rux-icon" aria-hidden="true">search</span>
						</button>
					</div>
					<div class="rux-ui-header__action-group rux-ui-header__action-group--identity">
						<button
							class="rux-button rux-button--default rux-button--icon rux-ui-header__profile"
							type="button"
							aria-label="Profile Menu"
						>
							<span class="rux-icon" aria-hidden="true">person</span>
						</button>
					</div>
				</div>
			</header>

			<main class="rux-app__body">
				<div
					class="example-navigation-scrim"
					aria-hidden="true"
					data-rux-side-nav-scrim
				></div>
				<nav
					class="rux-side-nav example-navigation"
					id="example-navigation"
					aria-label="Primary Navigation"
					aria-hidden="true"
					inert
					data-rux-side-nav
				>
					<ul class="rux-side-nav__list">
						<li class="rux-side-nav__item">
							<a class="rux-side-nav__link is-active" href="#workspace" aria-current="page">
								<span class="rux-icon" aria-hidden="true">map</span>
								<span class="rux-side-nav__label">Trips</span>
							</a>
						</li>
						<li class="rux-side-nav__item">
							<a class="rux-side-nav__link" href="#drivers">
								<span class="rux-icon" aria-hidden="true">person</span>
								<span class="rux-side-nav__label">Drivers</span>
							</a>
						</li>
					</ul>
				</nav>

				<section
					class="rux-workspace"
					id="workspace"
					aria-labelledby="workspace-title"
				>
					<header class="rux-workspace__header">
						<div class="rux-workspace__heading">
							<h1 class="rux-workspace__title" id="workspace-title">Calendar</h1>
						</div>
						<div class="rux-workspace__toolbar" aria-label="Calendar Actions">
							<button class="rux-button rux-button--default" type="button">Today</button>
							<button class="rux-button rux-button--accent" type="button">New Trip</button>
						</div>
					</header>
					<div class="rux-workspace__body example-workspace-content">
						<p>Primary workspace content</p>
					</div>
				</section>

				<aside
					class="rux-panel example-panel"
					aria-label="Calendar Tools"
				>
					<div class="rux-panel__nav">
						<div
							class="rux-tabs rux-tabs--attached"
							role="tablist"
							aria-label="Calendar Tool Sections"
						>
							<button class="rux-tab" type="button" role="tab" aria-selected="true" aria-controls="example-calendar-tools">
								Calendar
							</button>
							<button class="rux-tab" type="button" role="tab" aria-selected="false" aria-controls="example-driver-tools" tabindex="-1">
								Drivers
							</button>
						</div>
					</div>
					<div class="rux-panel__body">
						<div class="rux-panel__pane" id="example-calendar-tools" role="tabpanel">
							<article class="rux-card">
								<header class="rux-card__header">
									<h2 class="rux-card__title">Mini Calendar</h2>
								</header>
								<div class="rux-card__body">Calendar controls</div>
							</article>
						</div>
						<div class="rux-panel__pane" id="example-driver-tools" role="tabpanel" hidden>
							<p>Driver tools</p>
						</div>
					</div>
				</aside>
			</main>
		</div>
		<script src="../rux-ui/js/ui-shell.js"></script>
	</body>
</html>
