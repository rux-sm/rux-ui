<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening document…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Standalone stub — loads no stylesheet, so these are the dark
         catalog values as literals: background-200, gray-900, blue-900
         (docs/foundations/color.md §3.1). */
      background: #000000;
      color: #a1a1a1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .msg { text-align: center; }
    .msg a { color: #52a8ff; }
  </style>
</head>
<body>
  <div class="msg" id="msg">Opening document…</div>
  <script type="module">
    // The trip-documents bucket is closed, so the trip-document-link Edge
    // Function hands back a link to the file signed for ten minutes. The
    // document's id is the link's only secret.
    const LINK_FUNCTION = "https://udnmqhayzhrbltxzzhjw.supabase.co/functions/v1/trip-document-link";
    const msg = document.getElementById("msg");
    const id = new URLSearchParams(window.location.search).get("id");

    if (!id) {
      msg.textContent = "No document ID provided.";
    } else {
      try {
        const response = await fetch(LINK_FUNCTION, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data.url) {
          window.location.replace(data.url);
        } else if (response.status === 404 || response.status === 400) {
          msg.textContent = "Document not found.";
        } else {
          msg.textContent = "Could not load document.";
        }
      } catch (err) {
        msg.textContent = "Something went wrong. Please try again.";
      }
    }
  </script>
</body>
</html>
