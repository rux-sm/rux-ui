<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening document…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #aaa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .msg { text-align: center; }
    .msg a { color: #6B8AFF; }
  </style>
</head>
<body>
  <div class="msg" id="msg">Opening document…</div>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://white-boat-9932.rux-smercado.workers.dev";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkbm1xaGF5emhyYmx0eHp6aGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTU5NzcsImV4cCI6MjA5NjE3MTk3N30.i5q2SdSZLyOVEGZFFDTtVFqIMVEDz6jLO9ejJfy8Y94";
    const BUCKET = "trip-documents";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const msg = document.getElementById("msg");

    const id = new URLSearchParams(window.location.search).get("id");

    if (!id) {
      msg.textContent = "No document ID provided.";
    } else {
      try {
        const { data, error } = await supabase
          .from("trip_documents")
          .select("file_path, label, file_name")
          .eq("id", id)
          .single();

        if (error || !data) {
          msg.textContent = "Document not found.";
        } else {
          const { data: urlData } = supabase.storage.from(BUCKET).getPublicUrl(data.file_path);
          const url = urlData?.publicUrl;
          if (url) {
            window.location.replace(url);
          } else {
            msg.textContent = "Could not load document.";
          }
        }
      } catch (err) {
        msg.innerHTML = "Something went wrong. Please try again.";
      }
    }
  </script>
</body>
</html>
