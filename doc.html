<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Redirecting…</title>
		<!-- A trip document link, kept so links already sent still open. The page is the
		     scheduler's now, at /scheduler/share/document.html, which reads the same
		     address; the link's search and hash go with it. -->
		<script>
			location.replace("/scheduler/share/document.html" + location.search + location.hash);
		</script>
		<noscript><meta http-equiv="refresh" content="0; url=/scheduler/share/document.html" /></noscript>
	</head>
	<body>
		<p>This page moved to <a href="/scheduler/share/document.html">/scheduler/share/document.html</a>.</p>
	</body>
</html>
